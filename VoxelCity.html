:root{--bg:#14161c;--panel:#1d2029;--panel2:#252935;--edge:#3a3f4d;--text:#e9ecf2;--dim:#9aa3b5;--accent:#f2c230;--good:#4ade80;--bad:#ef5350;--amber:#f2a43a;--blue:#5aa9ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
#stage{position:fixed;inset:0}
.hd{font-family:"Courier New",ui-monospace,monospace;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.blk{background:var(--panel);box-shadow:0 0 0 3px var(--edge),6px 6px 0 3px #0b0c10}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;color:#14161c;background:var(--accent);padding:12px 22px;font:900 18px "Courier New",monospace;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 0 0 3px #b8901c,4px 4px 0 3px #0b0c10}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 3px #b8901c,2px 2px 0 3px #0b0c10}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:0 0 0 3px var(--edge),4px 4px 0 3px #0b0c10}
.overlay{position:fixed;inset:0;pointer-events:none}
.overlay>*{pointer-events:auto}
/* garage terminal */
#terminal{position:absolute;right:28px;top:28px;bottom:28px;width:430px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow:auto}
#terminal .screen-title{font-size:13px;color:var(--dim)}
#terminal h1{margin:0;font-size:28px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.voxels{color:var(--accent);font:900 22px "Courier New",monospace}
.crowns{color:#e8c46a;font:900 16px "Courier New",monospace;display:inline-flex;align-items:center;gap:4px}.crown-ic{display:inline-flex;color:#e8c46a;--accent:#b8901c;margin-right:3px;vertical-align:-2px}
.btn .crown-ic{color:#14161c;--accent:#14161c}
.cat-tag.cr{color:#e8c46a;display:inline-flex;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel2);padding:8px 10px;box-shadow:0 0 0 2px var(--edge)}
.stat b{display:block;font:900 20px "Courier New",monospace}
.stat span{font-size:12px;color:var(--dim)}
.upg h3{margin:4px 0 6px;font-size:14px}
.upg .desc{font-size:12px;color:var(--dim);margin-bottom:6px;min-height:16px}
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tier{border:0;padding:8px 2px;cursor:pointer;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font:700 12px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px}
.tier b{font:900 16px "Courier New",monospace}
.tier.equipped{background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}
.tier.owned{box-shadow:0 0 0 2px var(--accent)}
.tier.locked{opacity:.45;cursor:not-allowed}
.settings h3{margin:4px 0 6px;font-size:14px}
.setrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin:4px 0}
.seg{display:flex;gap:4px}
.seg button{border:0;padding:5px 8px;cursor:pointer;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font:700 11px system-ui}
.seg button.on{background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}
.next{background:var(--panel2);padding:10px 12px;box-shadow:0 0 0 2px var(--edge);font-size:13px}
.spacer{flex:1}
#terminal .btn.race{font-size:24px;padding:16px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:118px;padding:10px 14px;font-size:14px;z-index:6;pointer-events:none}
.catalog-mode ~ .toast,.strip-mode ~ .toast{bottom:auto;top:36px}
/* ---- Garage HUD (owner 2026-10-18) ---- */
#garage{position:absolute;inset:0;pointer-events:none}
#garage>*{pointer-events:auto}
.g-title{position:absolute;left:28px;top:24px;padding:14px 18px;background:#14161cc8;clip-path:polygon(0 8px,8px 8px,8px 0,100% 0,100% 100%,0 100%)}
.g-title .screen-title{font-size:13px;color:var(--dim)}
.g-title h1{margin:2px 0 6px;font-size:30px}
.g-stats{display:flex;gap:14px;font-size:12px;color:var(--dim)}.g-stats b{color:var(--text);font:900 15px "Courier New",monospace}
.g-wallet{position:absolute;right:28px;top:24px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:10px 16px;background:#14161cc8}
.g-rec{font-size:12px;color:var(--dim)}
.g-bar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;padding:8px;background:#14161cd8;box-shadow:0 0 0 3px var(--edge),6px 6px 0 3px #0b0c10}
.g-tab{border:0;cursor:pointer;width:104px;height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--panel2);color:#cfd3dc;box-shadow:0 0 0 2px var(--edge);font:800 12px system-ui;letter-spacing:.05em;text-transform:uppercase}
.g-tab:hover{color:#fff;box-shadow:0 0 0 2px #5a5f6d}
.g-tab.on{background:#2f3442;color:#fff;box-shadow:0 0 0 2px var(--accent)}
.g-racebtn{position:absolute;right:28px;bottom:22px;font-size:30px!important;padding:20px 34px!important}
/* update notice (owner V0.2.1): static, top centre, above everything */
.upd{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;padding:12px 16px;max-width:820px;width:max-content}
.upd-txt{display:flex;flex-direction:column;gap:2px}.upd-txt .hd{color:var(--accent);font-size:16px}.upd-txt span{font-size:12.5px;color:#cfd3dc}
.upd .btn{font-size:14px;padding:9px 14px;white-space:nowrap}
/* patch notes (owner 2026-10-19): small paper button bottom-left, panel opens above it */
.g-notesbtn{position:absolute;left:28px;bottom:22px;border:0;cursor:pointer;width:62px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#14161cd8;color:#cfd3dc;box-shadow:0 0 0 3px var(--edge),4px 4px 0 3px #0b0c10;font:800 10px "Courier New",monospace;letter-spacing:.04em}
.g-notesbtn:hover{color:#fff;box-shadow:0 0 0 3px #5a5f6d,4px 4px 0 3px #0b0c10}
.g-notesbtn.on{color:#fff;box-shadow:0 0 0 3px var(--accent),4px 4px 0 3px #0b0c10}
.g-new{position:absolute;top:-9px;right:-12px;font:900 9px system-ui;letter-spacing:.08em;text-transform:uppercase;font-style:normal;padding:2px 5px;background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}
.catalog-mode .g-notesbtn,.strip-mode .g-notesbtn{display:none}
.g-panel.g-notes{left:28px;right:auto;top:160px;bottom:106px;width:470px;gap:10px}
.pn-ver{padding:12px 14px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge)}
.pn-ver.big{box-shadow:0 0 0 2px var(--accent)}.pn-banner{margin:-12px -14px 10px;padding:8px 14px;background:var(--accent);color:#14161c;font-size:15px;letter-spacing:.1em}
.pn-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.pn-head .hd{color:var(--accent);font-size:18px}
.pn-head span{flex:1;font-weight:700;font-size:13px}.pn-head time{font-size:11px;color:var(--dim)}
.pn-kind{font:800 11px system-ui;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 2px}
.pn-added{color:var(--good)}.pn-changed{color:var(--blue)}.pn-fixed{color:var(--amber)}.pn-removed{color:var(--bad)}
.pn-ver ul{margin:0;padding-left:18px;font-size:12.5px;color:#cfd3dc}.pn-ver li{margin:2px 0}
.g-racemenu{position:absolute;right:28px;bottom:120px;display:flex;flex-direction:column;gap:10px;width:330px}
.g-mode{border:0;text-align:left;cursor:pointer;color:var(--text);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.g-mode .hd{font-size:20px;color:var(--accent)}
.g-mode-sub{grid-column:1;font-size:12px;color:var(--dim)}
.g-go{grid-row:1/3;grid-column:2;font:900 18px "Courier New",monospace;color:var(--good)}
.g-mode.off{cursor:default;opacity:.75}.g-mode.off .hd{color:var(--dim)}
.g-soon{grid-row:1/3;grid-column:2;font:800 11px system-ui;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge);color:var(--amber)}
.g-panel{position:absolute;right:28px;top:110px;bottom:128px;width:440px;padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.g-panel h2{margin:0;font-size:22px}
.g-close{position:absolute;right:10px;top:10px;border:0;cursor:pointer;width:30px;height:30px;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font:900 14px system-ui}
.g-note{font-size:12px;color:var(--dim)}
.g-avatar{display:flex;gap:14px;align-items:center}.g-avatar>div:last-child{display:flex;flex-direction:column;gap:3px}
.g-avatar-box{width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:var(--panel2);box-shadow:0 0 0 2px var(--edge);color:#cfd3dc}
.g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g-grid>div{background:var(--panel2);padding:10px;display:flex;flex-direction:column;gap:2px}
.g-grid b{font:900 18px "Courier New",monospace}.g-grid span{font-size:11px;color:var(--dim)}
/* Catalog: list on the left, turntable on the right, paint + features under the car */
.catalog-mode .g-title{left:28px}
.cat-list{position:absolute;left:28px;top:128px;bottom:128px;width:328px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.cat-card{border:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:6px 6px 8px;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);text-align:left}
.cat-thumb{display:block;width:100%;aspect-ratio:296/124;height:auto}
.cat-row{display:flex;justify-content:space-between;align-items:center;padding:0 4px}.cat-row b{font-size:15px}
.cat-tag{font:700 12px system-ui;font-style:normal;color:var(--accent)}.cat-tag.own{color:var(--dim)}.cat-tag.use{color:var(--good)}.cat-tag.short{color:var(--bad)}
.cat-buy{display:flex;gap:14px;align-items:center}.cat-act{padding:10px 22px;font-size:15px}.cat-act:disabled{opacity:.55;cursor:default}.cat-short{font:700 12px system-ui;color:var(--bad)}
.g-strip-bar{display:block;height:5px;background:#2a2e38;margin-top:6px}.g-strip-bar u{display:block;height:100%;background:var(--accent)}
.g-boss{font-style:normal;font:900 11px system-ui;color:#14161c;background:var(--bad);padding:1px 6px;margin-left:6px;vertical-align:3px}
.res-note{font:700 13px system-ui;color:var(--accent);margin-top:-6px}
.g-claimable{color:var(--accent);font-weight:800}
/* the Strip screen: a sideways scroller of level cards (owner: like CSR) */
.strip-wrap{position:absolute;left:28px;right:28px;bottom:118px;padding:12px 14px 14px;background:#14161ce0;display:flex;flex-direction:column;gap:10px}
.sl-head{display:flex;align-items:baseline;gap:14px;position:relative}.sl-head h2{margin:0;font-size:22px}.sl-head span{font-size:12px;color:var(--dim)}.sl-head .g-close{right:0;top:-2px}
.sl-row{display:flex;align-items:stretch;gap:8px;min-width:0}
.sl-arrow{flex:none;width:34px;border:0;cursor:pointer;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font-size:14px}
.sl-arrow:hover{background:#2f3442}
.strip-track{flex:1;min-width:0;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;padding:4px 2px 8px;cursor:grab;user-select:none}
.strip-track.dragging{cursor:grabbing;scroll-snap-type:none}
.sl-card{flex:none;width:176px;scroll-snap-align:center;display:flex;flex-direction:column;gap:5px;padding:10px 12px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge)}
.sl-card.next{box-shadow:0 0 0 3px var(--accent);background:#2f3442}.sl-card.claim{box-shadow:0 0 0 2px var(--good)}
.sl-card.locked{opacity:.55}.sl-card.boss .sl-top b{color:var(--bad)}
.sl-top{display:flex;align-items:center;gap:6px}.sl-top b{font-size:16px}
.sl-dist{font:800 20px "Courier New",monospace}.sl-rival{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-rw{display:flex;gap:8px;align-items:center;font-size:12px}.sl-rw b{color:var(--accent)}.sl-rw b.cr{color:#e8c46a;display:inline-flex;align-items:center}
.sl-extra{display:flex;flex-direction:column;gap:1px}.sl-extra em{font:700 10px system-ui;font-style:normal;color:#c9b8ff}.sl-extra em.car{color:var(--bad)}
.sl-btn{padding:6px 10px;font-size:13px;margin-top:2px}.sl-st{font:700 11px system-ui;color:var(--dim);margin-top:6px}.sl-st.ok{color:var(--good)}
.sl-bar{margin-top:0}
.g-pick{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.g-dist{display:flex;justify-content:flex-end}.g-dist button{min-width:64px}
.g-sub{font:600 12px system-ui;color:var(--dim);letter-spacing:0;text-transform:none;margin-left:8px}
/* Parts screen: side banner tabs + part cards (reuses the Catalog layout) */
.pt-tabs{position:absolute;left:28px;top:128px;bottom:128px;width:150px;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.pt-tab{border:0;cursor:pointer;text-align:left;padding:9px 10px;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font:800 13px system-ui;letter-spacing:.02em}
.pt-tab.on{background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}.pt-tab.soon{cursor:default;opacity:.4;font-weight:600;font-size:12px}
.catalog-mode .pt-list{left:196px;width:300px}.catalog-mode .pt-list ~ .cat-under{left:528px}
.pt-rar{font:800 10px system-ui;letter-spacing:.06em;text-transform:uppercase;padding:0 4px;color:var(--dim)}.pt-rar.rare{color:var(--blue)}.pt-rar.epic{color:#c9b8ff}
.cat-league{display:flex;gap:8px;align-items:baseline;padding:8px 4px 0;color:var(--accent)}.cat-league b{font-size:15px}.cat-league span{font-size:11px;color:var(--dim)}
.cat-card.on{background:#2f3442;box-shadow:0 0 0 2px var(--accent)}
.cat-under{position:absolute;left:400px;right:28px;bottom:128px;padding:12px 16px 12px;background:#14161cd8;display:flex;flex-direction:column;gap:10px;align-items:center}

ok hands. No one was mad. They had fun, and they would race again next week.","There is a small cafe by the track. It sells hot tea, warm buns and soup, and it is always full on a race day.","The old truck is slow up hills, but it never breaks down. It has done more miles than any car on our whole street.","Green means go. Red means stop. Keep your hands on the wheel, your eyes on the road, and you will be fine out there."],Xf=["The city wakes up slowly. Street lights fade, the first buses pull out of the depot, and somewhere a mechanic is already tuning an engine that will race tonight.","Rain left the road dark and shiny. The tyres hissed as the cars rolled to the line, and every driver waited for the lights with one eye on the big clock.","A good launch is half the race. Hold the revs steady, wait for green, and let the clutch bite smoothly so the wheels grip instead of spinning in place.","The corner shop opens at six. The owner sweeps the step, sets out fresh bread and newspapers, and waves at the tired night drivers heading home to sleep.","Under the bridge the old garage hums with work. Sparks fly from a grinder, a radio plays quietly, and a red hatchback sits on stands waiting for new wheels.","She checked the tyre pressure twice, wiped the windscreen, and took a slow breath. The track ahead was straight and short, and she knew every crack in it.","Downtown traffic moves like a river. Taxis weave between lanes, cyclists slip past the queues, and the delivery vans stop wherever they can find a gap.","The best drivers are calm drivers. They listen to the engine, feel the road through the wheel, and never rush a shift just because the crowd is getting loud.","At night the city glows in blue and orange. Neon signs flicker over the noodle bars, and the quiet streets turn into stages for anyone who is brave enough.","My first car was slow and loud and always smelled of oil. I loved it anyway, and I learned more fixing it in the driveway than I ever learned in a class.","The harbour road runs along the water for two miles. On clear mornings you can see the ferries crossing and hear the gulls fighting over the fish boats.","Every engine has a sweet spot. Shift too early and it bogs down, shift too late and it screams. Find the moment in between and the car pulls like a train.","The market fills the square on Saturdays. There are stalls for fruit, old records, spare parts and hot coffee, and people come from across the river to shop.","He kept a notebook in the glovebox with every race he had ever run. Times, weather, tyre pressures, even what he ate for lunch. Nothing was left to chance.","The tunnel under the hill is the fastest way east. It is long and bright and echoes with every gear change, so drivers there sound twice as fast as they are.","Paint is the last thing to go on. After weeks of welding, sanding and fitting, the car finally rolls into the booth bare and comes out shining like a sweet.","The old stadium is gone now, but the car park is still there. On summer nights it fills with cars, music and friends trading stories about their builds.","Typing fast is a lot like driving fast. Stay relaxed, look a little ahead, and keep a steady rhythm. When you make a mistake, fix it quickly and keep moving.","The bakery on the corner makes the city smell sweet at dawn. Drivers stop for warm rolls on the way to work and leave crumbs all over their front seats.","A storm rolled in from the coast just before the final. The organisers checked the sky, checked the track, and decided the race would go ahead anyway.","The garage cat sleeps on the warm bonnet of whichever car came in last. Nobody minds. She has been there longer than most of the mechanics, after all.","Bridges tie the city together. There are seven of them, from the iron rail bridge in the north to the wide new road bridge that glows bright green at night.","The rookie lost his first ten races. He did not quit. He watched the winners, asked questions, practised his launch every single day, and won the eleventh.","A clean car is a happy car. Wash the dust off the wheels, polish the lights, and vacuum the mats. It will not make you faster, but you will feel faster.","The bus driver knows every pothole on route nine. She steers around them without thinking, chats with the regulars, and still arrives right on time every day.","Light changes everything. The same street looks grey and tired at noon, gold and warm at sunset, and silver and strange under the orange lamps at midnight.","The crowd went quiet as the two cars lined up. One was old and loud, the other new and silent. When the light turned green, both shot off like arrows.","Spare parts pile up in every garage. Old wheels, a broken mirror, a box of bolts that fit nothing. Someday they might be useful, so nobody throws them out.","The park in the middle of the city is an island of green. Joggers loop the lake, kids feed the ducks, and the traffic noise fades to a soft and gentle hum.","Good tyres are worth more than a big engine. If the rubber cannot hold the road, all that power just turns into smoke and noise and a very slow start.","The radio announced the results at nine. The whole street cheered when they heard the name of the kid from the corner garage. He had finally done it, at last.","Some roads are made for speed and some are made for looking. The coast road is both, with long straights and a wide view of the sea around every single bend.","Before every race she taps the dashboard twice for luck. It is a silly habit and she knows it, but she has not lost a race since she started doing it.","The fuel station on the edge of town never closes. Truckers, taxi drivers and night racers all stop there for fuel, snacks and a few quiet minutes of rest.","Building a car takes patience. Parts arrive late, bolts snap, and nothing fits the first time. But the day it starts and drives, it all feels worth it.","The city has a sound of its own. Engines, sirens, footsteps, music from open windows, and under it all the low rumble of trains deep beneath the streets.","A drag race is over in seconds, but the work behind it takes months. Every part is chosen, tested and tuned so the car is ready for those few seconds.","Snow is rare here, but when it falls the city stops. The roads go white and quiet, schools close early, and everyone walks in the middle of the street.","The mechanic wiped her hands and smiled. The engine was running sweet and smooth at last. She closed the bonnet, tossed the keys over, and said good luck.","Win or lose, the drivers meet at the diner after the races. They share chips and stories, argue about gear ratios, and plan next week before going home.","The night before a big race the garage never sleeps. Someone is always bolting on a part, someone is always testing the lights, and someone is always making far too much coffee for everyone who is still awake.","The old tram line still runs along the river, slow and steady, past the warehouses and the new glass towers. Racers wait for it at the crossing, engines ticking over, and wave at the driver as the bell rings and it rolls by.","Tuning is a quiet art. Change one thing, test it, and write down what happened. A little more fuel, a little less weight, a slightly different gear. After a hundred small changes the car feels like a completely different machine.","Every district of the city has its own style. The harbour crews love loud old muscle cars, the uptown drivers polish their hatchbacks until they shine, and the kids from the tunnels build wild machines out of whatever they can find."],Zf=[`At 6:45 on Saturday morning, Marisol rolled her 1998 hatchback onto the scales: 1,042 kg, exactly. "Two kilos lighter than last week," she grinned, "and that's without the spare wheel!"`,`Race control's notice read: "Heats start at 19:30; finals at 21:15. Drivers must sign in by 18:45, wear an approved helmet, and keep their speed under 20 km/h in the pits."`,`Kenji's notebook was full of numbers: 3.21 final drive, 4,800 rpm launch, 29 psi in the fronts, 31 in the rears. Every page ended the same way - "Try again tomorrow, and write it all down."`,"The Harbour Bridge opened in 1931, closed for repairs in 1987, and reopened two years later with six lanes instead of four. Locals still argue about which version looked better.","Why do some drivers shift early? Nerves, mostly. The best advice I ever heard was simple: breathe out, count to two, and trust the lights; the car will do the rest for you.","Priya's shop, Voxel & Sons Tyres, has been on Quay Street since 1974. Her grandfather opened it with a single jack, three spanners and a loan of 400 pounds from his brother.","Weather update: light rain until 14:00, then clearing; winds from the north-west at 15-25 km/h. Track temperature should reach 28 degrees by the evening heats, perfect for grip.","The final was close - absurdly close. Dax crossed the line at 12.418 seconds; Halden at 12.421. Three thousandths! Neither of them believed it until they saw the replay twice.",`"Don't chase the redline," the old mechanic said, tapping the dial. "Find the torque, shift on the beat, and let the engine breathe." Then he went back to his coffee and crossword.`,"Route 9 runs 14 km from the depot to the airport, with 27 stops, 11 traffic lights and one level crossing that, according to every driver, is always closed when you're running late.","The rules are strict: no nitrous on the street, no racing after midnight, and absolutely no burnouts outside the bakery on Elm Road. Mrs. Okafor has complained 17 times this year.","Tuning tip #42: change one thing at a time. If you alter the gearing, tyre pressure and ride height in one go, you'll never know which change helped - or which one cost you 0.3 s.","On the night of the 2019 city final, the power failed at 21:07. Two hundred people held up their phones; the racers lined up anyway, lit only by headlights and a sea of tiny screens.","Sable's checklist, taped to the dash: fuel (half), tyres (warm), belts (tight), mirrors (set), mind (clear). She has used the same list for 9 years and lost only 3 races in that time.","The Downtown Grid isn't a real grid at all; it's a tangle of one-way streets, two roundabouts and a tunnel. Newcomers get lost; locals take the shortcut behind the old cinema.","Can a 120 hp hatchback beat a 400 hp coupe? Over 400 m, rarely. Over a twisty kilometre in the rain? Often! Power matters, but grip, weight and nerve matter just as much, if not more.",`Halden's first car cost 650 pounds, needed a new clutch, two tyres and a door, and leaked oil onto every driveway it visited. He still calls it "the best car I'll ever own."`,"By 23:30 the car park had emptied: a few last engines ticking as they cooled, a lone food truck closing its shutters, and Tamsin, still under her car, chasing one stubborn rattle.","Lap records at the old airfield: 58.2 s (1996), 55.9 s (2004), 54.1 s (2015). Nobody has gone under 54 since; some say the bumpy third corner simply won't allow it, however brave you are.",`The museum's newest exhibit is a battered rally sedan, still caked in mud from its last event. A small sign reads: "Please don't clean it - the dirt is part of the story."`],ep={easy:$f,medium:Xf,hard:Zf},EE=[...$f,...Xf,...Zf];var Fh=(i,e)=>e>0?i/5/(e/60):0,Qo=class{constructor(e){Y(this,"text",e);Y(this,"pos",0);Y(this,"typo",!1);Y(this,"keys",0);Y(this,"errors",0);Y(this,"finish",null);Y(this,"lastHit",0);Y(this,"nitros",sn.nitros);Y(this,"nitroAt",-99)}get done(){return this.pos>=this.text.length}get progress(){return this.pos/this.text.length}key(e,t){return this.done||e.length!==1?"ignored":e===" "&&this.text[this.pos]!==" "&&this.nitros>0?this.nitro(t):(this.keys++,e===this.text[this.pos]?(this.pos++,this.typo=!1,this.lastHit=t,this.done&&(this.finish=t),"ok"):(this.errors++,this.typo=!0,"typo"))}nitro(e){if(this.done||this.nitros<=0||this.text[this.pos]===" ")return"ignored";for(;this.pos<this.text.lengt our average for the difficulty you picked."]},{version:"0.3.1",date:"2026-10-19",title:"Typing Race: cars glide",changed:["Typing Race cars now have momentum: when you stop typing (or hit a typo) your car glides on and eases to a stop instead of stopping dead. Rivals move the same way. A car never drives past the letters typed.","After the last letter, the results wait a moment longer so your car can roll over the finish line."]},{version:"0.3.0",date:"2026-10-19",title:"Typing Race",added:["Typing Race (Race \u25B8 Typing Race): a Nitro Type-style race seen from straight above. Five cars in five lanes on a voxel street; the camera follows your car.","Type the passage to drive: every correct key moves you forward. A wrong key turns that letter red and holds you until you type the right one; your car rolls to a stop meanwhile.","Start lamps light one by one, then GO (steady lamps, no blinking). Live WPM, accuracy, place and time while you type; each car has a name tag with its live WPM; a progress bar shows the whole race.","Rivals type at speeds matched to your average WPM (your last 10 Typing Races), using the Easy / Medium / Hard picker: typing at your average just wins on Medium.","Pay by place (League D Medium win 1,000 VX, scaled by your car's league and the difficulty), plus bonuses for a new best WPM and 98%+ accuracy.","44 original passages about the city, its cars and its people.","Profile shows your best WPM, average WPM and Typing Race wins.","Esc leaves a Typing Race."],changed:["Typing speed is all that matters in a Typing Race. The car you drive is for looks (your paint, decals and parts show from above)."]},{version:"0.2.1",date:"2026-10-19",title:"Update notice",added:['Update notice: when a newer version is published on the website, the garage (or results screen) shows "Update ready" with Refresh now / Later. Refresh saves and reloads into the new version as a new session; your progress is kept. It never pops up during a race.','After an update, the first garage visit says "Updated to V\u2026" and the Patch notes button shows NEW.',"Every build now writes version.json next to the game, which the website version checks every 2 minutes and whenever you come back to the tab."],fixed:["Opening the website straight after an upload could keep showing the old version from the browser's cache. Refresh now loads a fresh copy."]},{version:"0.2.0",date:"2026-10-19",title:"Parts v2: Decals, Underglow, Body kit",added:["Decals tab: Side stripe, Checker band, Race number, Racing stripes and Flames. Stripe colours pick white or black to stand out on your paint.","Boss decals: the decal from every Strip boss (Rook, Brass, Viper, Nova, Apex \xB7 I \u2013 VI) now shows in Decals once won, and fits for free. Emblem on both doors and the hood.","Underglow tab: Ice blue, Neon green, Violet, Red, Hot pink, White and a blue / pink Two-tone. Steady glow, never blinks or pulses.","Body kit tabs: Front bumper (Front lip, Aero bumper, Track splitter), Side skirts (Black, Body-colour, Carbon) and Rear diffuser (Street, Race).","Rivals now wear random visual parts (spoilers, wheels, decals, underglow \u2026). Looks only, no effect on speed.","New part-card close-ups for the side, nose, sills and underside."],changed:[`Parts no longer sells what your car already has: a part that matches the car's factory part is folded into its Factory card (e.g. "Factory \xB7 GT wing" on the Tuner coupe).`,"Vented hood is subtler: slim dark slots set into the hood, kept inside the front fenders on every car.","Carbon hood covers only the hood panel, not the raised fenders over the wheels."],fixed:["Hood vents clipped through the wheel arches / fenders on some cars."]},{version:"0.1.2",date:"2026-10-19",title:"Race button fix",changed:["The Race button now closes whatever is open (Profile, Upgrades, Parts, Catalog, Settings, the Strip or Patch notes) and opens the race menu on its own."],fixed:["Opening the race menu while another panel (e.g. Parts) was open showed both at once, with the race menu behind."]},{version:"0.1.1",date:"2026-10-19",title:"Patch notes + web build",added:["Patch notes: the paper button at the bottom-left of the garage lists every version's additions, changes, fixes and removals.","The button shows NEW until you have read the latest notes.","Web build: the game now builds an index.html next to VoxelCity.html, so the GitHub Pages link opens the game directly."],fixed:["GitHub Pages link opened an empty page (the site had no index.html)."]},{version:"0.1.0",date:"2026-10-19",title:"First playable builds (Oct 16 \u2013 19)",added:["Drag racing: hold to rev, launch on green, timed up-shifts with Perfect / Good / Early / Late grades, downshift paddle with over-rev.","Race HUD: tachometer, gear, speed, Perfect Shift paddle and gas pedal (on-screen or SPACE / SHIFT).","Downtown street scene at real scale: buildings, props, trees, side streets, day / dusk / night, speed blur, start-line camera glide.","Garage: car on a turntable, wallet, and Profile \xB7 Upgrades \xB7 Parts \xB7 Catalog \xB7 Settings.","Panda Civix starter car plus 13 more cars across Leagues D (hatchbacks), C (muscle), B (street racers), A (tuners / GTs) and S (hypercars).","Each car has its own acceleration, shift speed, grip, top speed, launch window and shift window; some are better at short dashes, others over 800 m.","Catalog: 3D car stills, stats bars, prices, buy with Voxels (VX) or Crowns; paint and body options saved per car.","Crowns currency; the Performance hatch is Crowns-only.","Engine and transmission upgrades T1 \u2013 T5 per league, saved per car.","Street Races with scene names and Easy / Medium / Hard difficulty (harder = closer races, bigger payouts).","Race lengths: 600 m, 700 m and 800 m, with a best time for each.","Random rivals: a new rival every race, matched to your car and upgrades; a perfect run always wins.","The Strip: 60 levels per league, each harder than the last, ending in a maxed, near-perfect rival.","Strip screen with sliding level cards and claimable rewards: VX every level, 5 Crowns + cash + a universal decal on every 10th (boss) level, and a unique boss car on level 60.","Visual parts (bought once, fit every car): Spoilers, Exhausts, Hoods, Wheels and Paint finishes (gloss, matte, metallic, pearl), with close-up 3D cards.","Economy in one file (car prices, payouts, part prices, Strip rewards) so numbers are easy to change.","Local test console (add ?dev to the address, then press `)."],changed:["Money slowed down so each league takes time: about 30 Medium wins buy a league's cheapest car."],fixed:["Results screen showed only a GARAGE button (the button covered the whole panel).","Pop-up messages could block the Buy button."],removed:["Strip reset option (the Strip is a one-way side quest)."]}],Bn=Cr[0].version;var sp=i=>{let e=document.createElement("template");return e.innerHTML=i.trim(),e.content.firstElementChild},hp=i=>i.toFixed(3)+" s",H={panel:null,back:null,work:"",gsel:"",dial:!1,favOnly:!1,raceMenu:!1,part:{slot:"spoiler",sel:""},cat:{id:"panda_civix",paint:"",opts:{}}};function Hh(){H.panel=null,H.back=null,H.dial=!1,H.raceMenu=!1}var up=()=>H.panel==="catalog"||H.panel==="parts"||H.panel==="garage"||!!H.back;function dp(){H.panel="strip",H.raceMenu=!1,Vo=!0}var G1=[["camera","Race camera",[["dynamic","Dynamic"],["close","Dynamic close"]]],["time","Time of day",[["day","Day"],["dusk","Dusk"],["night","Night"]]],["nearSide","Near side",[["mixed","Mixed"],["curb","Curb"],["barrier","Barrier"]]],["blur","Speed blur",[["off","Off"],["low","Low"],["full","Full"]]]],ua={profile:["000111111000","001111111100","011111111110","011111111110","112222222211","112222222211","111111111111","111111111111","011111111110","001111111100","001100001100","011100001110"],upgrades:["000000001100","000000011110","000000110110","000001100110","000011111100","000111111000","001111100000","011111000000","111110000000","111100000000","011000000000","000000000000"],catal
