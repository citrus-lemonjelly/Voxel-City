:root{--bg:#14161c;--panel:#1d2029;--panel2:#252935;--edge:#3a3f4d;--text:#e9ecf2;--dim:#9aa3b5;--accent:#f2c230;--good:#4ade80;--bad:#ef5350;--amber:#f2a43a;--blue:#5aa9ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
#stage{position:fixed;inset:0}
.hd{font-family:"Courier New",ui-monospace,monospace;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.blk{background:var(--panel);box-shadow:0 0 0 3px var(--edge),6px 6px 0 3px #0b0c10}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;color:#14161c;background:var(--accent);padding:12px 22px;font:900 18px "Courier New",monospace;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 0 0 3px #b8901c,4px 4px 0 3px #0b0c10}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 3px #b8901c,2px 2px 0 3px #0b0c10}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:0 0 0 3px var(--edge),4px 4px 0 3px #0b0c10}
.overlay{position:fixed;inset:0;pointer-events:none}
.overlay>*{pointer-events:auto}
/* garage terminal */
#terminal{position:absolute;right:28px;top:28px;bottom:28px;width:430px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow:auto}
#terminal .screen-title{font-size:13px;color:var(--dim)}
#terminal h1{margin:0;font-size:28px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.voxels{color:var(--accent);font:900 22px "Courier New",monospace}
.crowns{color:#e8c46a;font:900 16px "Courier New",monospace;display:inline-flex;align-items:center;gap:4px}.crown-ic{display:inline-flex;color:#e8c46a;--accent:#b8901c;margin-right:3px;vertical-align:-2px}
.btn .crown-ic{color:#14161c;--accent:#14161c}
.cat-tag.cr{color:#e8c46a;display:inline-flex;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel2);padding:8px 10px;box-shadow:0 0 0 2px var(--edge)}
.stat b{display:block;font:900 20px "Courier New",monospace}
.stat span{font-size:12px;color:var(--dim)}
.upg h3{margin:4px 0 6px;font-size:14px}
.upg .desc{font-size:12px;color:var(--dim);margin-bottom:6px;min-height:16px}
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tier{border:0;padding:8px 2px;cursor:pointer;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font:700 12px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px}
.tier b{font:900 16px "Courier New",monospace}
.tier.equipped{background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}
.tier.owned{box-shadow:0 0 0 2px var(--accent)}
.tier.locked{opacity:.45;cursor:not-allowed}
.settings h3{margin:4px 0 6px;font-size:14px}
.setrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin:4px 0}
.seg{display:flex;gap:4px}
.seg button{border:0;padding:5px 8px;cursor:pointer;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font:700 11px system-ui}
.seg button.on{background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}
.next{background:var(--panel2);padding:10px 12px;box-shadow:0 0 0 2px var(--edge);font-size:13px}
.spacer{flex:1}
#terminal .btn.race{font-size:24px;padding:16px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:118px;padding:10px 14px;font-size:14px;z-index:6;pointer-events:none}
.catalog-mode ~ .toast,.strip-mode ~ .toast{bottom:auto;top:36px}
/* ---- Garage HUD (owner 2026-10-18) ---- */
#garage{position:absolute;inset:0;pointer-events:none}
#garage>*{pointer-events:auto}
.g-title{position:absolute;left:28px;top:24px;padding:14px 18px;background:#14161cc8;clip-path:polygon(0 8px,8px 8px,8px 0,100% 0,100% 100%,0 100%)}
.g-title .screen-title{font-size:13px;color:var(--dim)}
.g-title h1{margin:2px 0 6px;font-size:30px}
.g-stats{display:flex;gap:14px;font-size:12px;color:var(--dim)}.g-stats b{color:var(--text);font:900 15px "Courier New",monospace}
.g-wallet{position:absolute;right:28px;top:24px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:10px 16px;background:#14161cc8}
.g-rec{font-size:12px;color:var(--dim)}
.g-bar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;padding:8px;background:#14161cd8;box-shadow:0 0 0 3px var(--edge),6px 6px 0 3px #0b0c10}
.g-tab{border:0;cursor:pointer;width:104px;height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--panel2);color:#cfd3dc;box-shadow:0 0 0 2px var(--edge);font:800 12px system-ui;letter-spacing:.05em;text-transform:uppercase}
.g-tab:hover{color:#fff;box-shadow:0 0 0 2px #5a5f6d}
.g-tab.on{background:#2f3442;color:#fff;box-shadow:0 0 0 2px var(--accent)}
.g-tab.g-spin{width:88px;margin-right:8px}
.g-tabwrap{position:relative;display:flex}
.g-sub{position:absolute;left:50%;bottom:calc(100% + 22px);transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;background:#14161cf0;white-space:nowrap;z-index:6}
.g-sub-name{font:900 11px 'Courier New',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:0 6px 0 2px}
.g-subtab{border:0;cursor:pointer;height:30px;padding:0 12px;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font:900 12px 'Courier New',monospace;letter-spacing:.08em;text-transform:uppercase}
.g-subtab:hover:not(:disabled){box-shadow:0 0 0 2px var(--accent)}
.g-subtab.drive{background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}
.g-subtab:disabled{cursor:default;opacity:.6}
.g-sub-stem{position:absolute;left:50%;top:100%;width:6px;height:16px;margin-left:-3px;background:var(--edge);box-shadow:3px 3px 0 #0b0c10}
.g-tab.g-spin:not(.on){color:#7d8290}
canvas.grab{cursor:grab}canvas.grabbing{cursor:grabbing}
.g-racebtn{position:absolute;right:28px;bottom:22px;font-size:30px!important;padding:20px 34px!important}
/* update notice (owner V0.2.1): static, top centre, above everything */
.upd{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;padding:12px 16px;max-width:820px;width:max-content}
.upd-txt{display:flex;flex-direction:column;gap:2px}.upd-txt .hd{color:var(--accent);font-size:16px}.upd-txt span{font-size:12.5px;color:#cfd3dc}
.upd .btn{font-size:14px;padding:9px 14px;white-space:nowrap}
/* patch notes (owner 2026-10-19): small paper button bottom-left, panel opens above it */
.g-notesbtn{position:absolute;left:28px;bottom:22px;border:0;cursor:pointer;width:62px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#14161cd8;color:#cfd3dc;box-shadow:0 0 0 3px var(--edge),4px 4px 0 3px #0b0c10;font:800 10px "Courier New",monospace;letter-spacing:.04em}
.g-notesbtn:hover{color:#fff;box-shadow:0 0 0 3px #5a5f6d,4px 4px 0 3px #0b0c10}
.g-notesbtn.on{color:#fff;box-shadow:0 0 0 3px var(--accent),4px 4px 0 3px #0b0c10}
.g-new{position:absolute;top:-9px;right:-12px;font:900 9px system-ui;letter-spacing:.08em;text-transform:uppercase;font-style:normal;padding:2px 5px;background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}
.catalog-mode .g-notesbtn,.strip-mode .g-notesbtn{display:none}
.g-panel.g-notes{left:28px;right:auto;top:160px;bottom:106px;width:470px;gap:10px}
.pn-ver{padding:12px 14px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge)}
.pn-ver.big{box-shadow:0 0 0 2px var(--accent)}.pn-banner{margin:-12px -14px 10px;padding:8px 14px;background:var(--accent);color:#14161c;font-size:15px;letter-spacing:.1em}
.pn-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.pn-head .hd{color:var(--accent);font-size:18px}
.pn-head span{flex:1;font-weight:700;font-size:13px}.pn-head time{font-size:11px;color:var(--dim)}
.pn-kind{font:800 11px system-ui;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 2px}
.pn-added{color:var(--good)}.pn-changed{color:var(--blue)}.pn-fixed{color:var(--amber)}.pn-removed{color:var(--bad)}
.pn-ver ul{margin:0;padding-left:18px;font-size:12.5px;color:#cfd3dc}.pn-ver li{margin:2px 0}
.g-racemenu{position:absolute;right:28px;bottom:120px;display:flex;flex-direction:column;gap:10px;width:330px}
.g-mode{border:0;text-align:left;cursor:pointer;color:var(--text);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.g-mode .hd{font-size:20px;color:var(--accent)}
.g-mode-sub{grid-column:1;font-size:12px;color:var(--dim)}
.g-go{grid-row:1/3;grid-column:2;font:900 18px "Courier New",monospace;color:var(--good)}
.g-mode.off{cursor:default;opacity:.75}.g-mode.off .hd{color:var(--dim)}
.g-soon{grid-row:1/3;grid-column:2;font:800 11px system-ui;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge);color:var(--amber)}
.g-panel{position:absolute;right:28px;top:110px;bottom:128px;width:440px;padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.g-panel h2{margin:0;font-size:22px}
.g-close{position:absolute;right:10px;top:10px;border:0;cursor:pointer;width:30px;height:30px;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font:900 14px system-ui}
.g-note{font-size:12px;color:var(--dim)}
.g-avatar{display:flex;gap:14px;align-items:center}.g-avatar>div:last-child{display:flex;flex-direction:column;gap:3px}
.g-avatar-box{width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:var(--panel2);box-shadow:0 0 0 2px var(--edge);color:#cfd3dc}
.g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g-grid>div{background:var(--panel2);padding:10px;display:flex;flex-direction:column;gap:2px}
.g-grid b{font:900 18px "Courier New",monospace}.g-grid span{font-size:11px;color:var(--dim)}
/* Catalog: list on the left, turntable on the right, paint + features under the car */
.catalog-mode .g-title{left:28px}
.cat-list{position:absolute;left:28px;top:128px;bottom:128px;width:328px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.cat-card{border:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:6px 6px 8px;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);text-align:left}
.cat-thumb{display:block;width:100%;aspect-ratio:296/124;height:auto}
.cat-row{display:flex;justify-content:space-between;align-items:center;padding:0 4px}.cat-row b{font-size:15px}
.cat-tag{font:700 12px system-ui;font-style:normal;color:var(--accent)}.cat-tag.own{color:var(--dim)}.cat-tag.use{color:var(--good)}.cat-tag.short{color:var(--bad)}
.cat-buy{display:flex;gap:14px;align-items:center}.cat-act{padding:10px 22px;font-size:15px}.cat-act:disabled{opacity:.55;cursor:default}.cat-short{font:700 12px system-ui;color:var(--bad)}
.g-strip-bar{display:block;height:5px;background:#2a2e38;margin-top:6px}.g-strip-bar u{display:block;height:100%;background:var(--accent)}
.g-boss{font-style:normal;font:900 11px system-ui;color:#14161c;background:var(--bad);padding:1px 6px;margin-left:6px;vertical-align:3px}
.res-note{font:700 13px system-ui;color:var(--accent);margin-top:-6px}
.g-claimable{color:var(--accent);font-weight:800}
/* the Strip screen: a sideways scroller of level cards (owner: like CSR) */
.strip-wrap{position:absolute;left:28px;right:28px;bottom:118px;padding:12px 14px 14px;background:#14161ce0;display:flex;flex-direction:column;gap:10px}
.sl-head{display:flex;align-items:baseline;gap:14px;position:relative}.sl-head h2{margin:0;font-size:22px}.sl-head span{font-size:12px;color:var(--dim)}.sl-head .g-close{right:0;top:-2px}
.sl-row{display:flex;align-items:stretch;gap:8px;min-width:0}
.sl-arrow{flex:none;width:34px;border:0;cursor:pointer;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font-size:14px}
.sl-arrow:hover{background:#2f3442}
.strip-track{flex:1;min-width:0;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;padding:4px 2px 8px;cursor:grab;user-select:none}

.lab-n span{flex:0 0 120px}.lab-n input{flex:1}.lab-n em{flex:0 0 32px;font-style:normal;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.lab-p select,.lab-sec select{background:#14161c;color:var(--text);border:0;box-shadow:0 0 0 2px var(--edge);padding:3px 6px;font:600 12px system-ui}
.lab-flags{display:grid;grid-template-columns:1fr 1fr;gap:4px}.lab-flags label{justify-content:flex-start}
#carlab textarea{background:#14161c;color:var(--text);border:0;box-shadow:0 0 0 2px var(--edge);font:12px "Courier New",monospace;padding:6px;resize:vertical}
.lab-btns{display:flex;gap:8px;flex-wrap:wrap}.lab-btns .btn{font-size:12px;padding:8px 10px}.lab-msg{color:var(--good)}

/* ---- Settings \u25B8 Controls (owner 2026-10-19) ---- */
.ctl{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge)}.ctl h3{margin:0;font-size:14px;color:var(--accent)}
.ctl-tabs{display:flex;margin-bottom:4px}.ctl-tabs button{flex:1;padding:7px 8px;font-size:12px}
.keycap{border:0;cursor:pointer;min-width:84px;padding:5px 10px;background:#14161c;color:var(--text);font:900 12px "Courier New",monospace;letter-spacing:.06em;box-shadow:0 0 0 2px var(--edge),3px 3px 0 2px #0b0c10}
.keycap:hover{box-shadow:0 0 0 2px var(--accent),3px 3px 0 2px #0b0c10}.keycap.wait{background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c,3px 3px 0 2px #0b0c10}
.keycap.ghost{min-width:0;color:var(--dim)}
.ctl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:2px}
/* Garage \u25B8 per-car record */
.gr-rec{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--dim);padding:6px 8px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge)}
.gr-rec b{color:var(--text);font:700 12px system-ui;font-variant-numeric:tabular-nums}.gr-rec em{font-style:normal;font-size:10px}
/* V0.9.0 Economy Update: Daily tab, garage slots + boss tab, sell */
.g-tab{position:relative}
.g-dot{position:absolute;top:7px;right:9px;width:8px;height:8px;background:var(--accent);box-shadow:0 0 0 2px #b8901c}
.gr-tabs{display:flex;margin:2px 4px 8px}.gr-tabs button{flex:1;padding:7px 8px;font:900 12px 'Courier New',monospace;letter-spacing:.06em;text-transform:uppercase}
.gr-head{gap:6px}.gr-head .hd{margin-right:auto}
.gr-slot{border:0;cursor:pointer;font:800 11px system-ui;padding:5px 8px;background:var(--panel2);color:#e8c46a;box-shadow:0 0 0 2px var(--edge);display:inline-flex;align-items:center}
.gr-slot:hover:not(:disabled){box-shadow:0 0 0 2px var(--accent)}.gr-slot:disabled{opacity:.45;cursor:not-allowed}
.g-subtab.sell.arm{background:var(--bad);color:#fff;box-shadow:0 0 0 2px #8e2a28}
.g-panel.g-daily{width:480px}
.dl-list{display:flex;flex-direction:column;gap:8px}
.dl-task{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 12px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge)}
.dl-task.done{box-shadow:0 0 0 2px var(--accent)}.dl-task.got{opacity:.55}
.dl-txt{font:800 13px system-ui}
.dl-rw{font:900 12px 'Courier New',monospace;color:var(--accent);display:inline-flex;gap:8px;align-items:center;justify-self:end}
.dl-cr{color:#e8c46a;display:inline-flex;align-items:center}
.dl-bar{display:block;height:8px;background:#14161c;box-shadow:0 0 0 2px var(--edge)}.dl-bar u{display:block;height:100%;background:var(--accent)}
.dl-st{font:900 12px 'Courier New',monospace;font-style:normal;color:var(--dim);justify-self:end;text-transform:uppercase}
.dl-btn{font-size:13px;padding:5px 14px;justify-self:end}
.dl-h{margin:6px 0 0;font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal-day{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge);font:700 11px 'Courier New',monospace;color:var(--dim)}
.cal-day b{color:var(--text);font-size:12px}
.cal-day.big{box-shadow:0 0 0 2px #e8c46a}
.cal-day.today{box-shadow:0 0 0 2px var(--accent);color:var(--accent);background:#2f3442}
.cal-day.got{opacity:.45}.cal-day em{position:absolute;top:1px;right:3px;font-style:normal;color:var(--good)}
.cal-sw{display:block;width:16px;height:12px;box-shadow:0 0 0 2px #0b0c10}
.cal-cr{color:#e8c46a;display:inline-flex;align-items:center}
.cal-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cal-foot .btn{font-size:14px;padding:8px 14px}
/* V0.9.1 mini HUD: Spin \xB7 Daily / Calendar \xB7 spare, one tab-sized square beside Profile */
.g-mini{display:grid;grid-template-columns:35px 35px;grid-template-rows:35px 35px;gap:4px;margin-right:8px}
.g-mb{position:relative;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--panel2);color:#cfd3dc;box-shadow:0 0 0 2px var(--edge);padding:0}
.g-mb:hover:not(:disabled){color:#fff;box-shadow:0 0 0 2px #5a5f6d}
.g-mb.sel{background:#2f3442;color:#fff;box-shadow:0 0 0 2px var(--accent)}
.g-mb.off{color:#7d8290}
.g-mb.empty{cursor:default;background:#1a1d25}
.g-mb .g-dot{top:3px;right:3px;width:6px;height:6px}

{...u,rival:h,target:l};return jf.set(n,f),f}var Wf=["The sun is up and the road is dry. Five cars roll to the line. The lights go on, one by one, and then it is time to go.","My car is small and red. It is not the fastest car in town, but it starts every day and it takes me where I need to go.","The shop at the end of the street sells tyres, oil and cold drinks. The man who runs it knows the name of every car.","We wash the car on a hot day. The water is cold, the soap is thick, and by the end the car shines and so do we.","A cat sat on the hood of the blue van all day. When the van left, the cat went to find a new warm spot in the sun.","The bus stops at the park at nine. Kids get off with their bags, wave to the driver, and run to the swings and slides.","Rain fell all night. In the morning the streets were clean and wet, and the cars made a soft hiss as they drove past.","Turn the key, check the mirror, and pull out slow. The road is long and there is no need to rush on a quiet day.","The race was short. The two cars left the line side by side, and the red one won by less than the length of a door.","I like the sound of a car at night. It starts low and far away, gets loud as it goes past, and then fades out again.","The new garage has big doors and bright lights. There is room for six cars, a work bench, and a small fridge too.","Fill the tank, check the tyres, and clean the glass. A few small jobs each week keep a car happy for a long time.","The city is calm at dawn. Shops are shut, the roads are clear, and the only sound is a train on the far side of town.","She drove to the coast with the windows down. The air was warm and salty, and the road ran right along the sand.","A good driver looks far down the road. That way there is time to slow down, change lanes, or stop if there is a need.","The kid next door has a toy car that he drives around the yard. One day, he says, he will race a real one in town.","At the end of the race they all shook hands. No one was mad. They had fun, and they would race again next week.","There is a small cafe by the track. It sells hot tea, warm buns and soup, and it is always full on a race day.","The old truck is slow up hills, but it never breaks down. It has done more miles than any car on our whole street.","Green means go. Red means stop. Keep your hands on the wheel, your eyes on the road, and you will be fine out there."],Kf=["The city wakes up slowly. Street lights fade, the first buses pull out of the depot, and somewhere a mechanic is already tuning an engine that will race tonight.","Rain left the road dark and shiny. The tyres hissed as the cars rolled to the line, and every driver waited for the lights with one eye on the big clock.","A good launch is half the race. Hold the revs steady, wait for green, and let the clutch bite smoothly so the wheels grip instead of spinning in place.","The corner shop opens at six. The owner sweeps the step, sets out fresh bread and newspapers, and waves at the tired night drivers heading home to sleep.","Under the bridge the old garage hums with work. Sparks fly from a grinder, a radio plays quietly, and a red hatchback sits on stands waiting for new wheels.","She checked the tyre pressure twice, wiped the windscreen, and took a slow breath. The track ahead was straight and short, and she knew every crack in it.","Downtown traffic moves like a river. Taxis weave between lanes, cyclists slip past the queues, and the delivery vans stop wherever they can find a gap.","The best drivers are calm drivers. They listen to the engine, feel the road through the wheel, and never rush a shift just because the crowd is getting loud.","At night the city glows in blue and orange. Neon signs flicker over the noodle bars, and the quiet streets turn into stages for anyone who is brave enough.","My first car was slow and loud and always smelled of oil. I loved it anyway, and I learned more fixing it in the driveway than I ever learned in a class.","The harbour road runs along the water for two miles. On clear mornings you can see the ferries crossing and hear the gulls fighting over the fish boats.","Every engine has a sweet spot. Shift too early and it bogs down, shift too late and it screams. Find the moment in between and the car pulls like a train.","The market fills the square on Saturdays. There are stalls for fruit, old records, spare parts and hot coffee, and people come from across the river to shop.","He kept a notebook in the glovebox with every race he had ever run. Times, weather, tyre pressures, even what he ate for lunch. Nothing was left to chance.","The tunnel under the hill is the fastest way east. It is long and bright and echoes with every gear change, so drivers there sound twice as fast as they are.","Paint is the last thing to go on. After weeks of welding, sanding and fitting, the car finally rolls into the booth bare and comes out shining like a sweet.","The old stadium is gone now, but the car park is still there. On summer nights it fills with cars, music and friends trading stories about their builds.","Typing fast is a lot like driving fast. Stay relaxed, look a little ahead, and keep a steady rhythm. When you make a mistake, fix it quickly and keep moving.","The bakery on the corner makes the city smell sweet at dawn. Drivers stop for warm rolls on the way to work and leave crumbs all over their front seats.","A storm rolled in from the coast just before the final. The organisers checked the sky, checked the track, and decided the race would go ahead anyway.","The garage cat sleeps on the warm bonnet of whichever car came in last. Nobody minds. She has been there longer than most of the mechanics, after all.","Bridges tie the city together. There are seven of them, from the iron rail bridge in the north to the wide new road bridge that glows bright green at night.","The rookie lost his first ten races. He did not quit. He watched the winners, asked questions, practised his launch every single day, and won the eleventh.","A clean car is a happy car. Wash the dust off the wheels, polish the lights, and vacuum the mats. It will not make you faster, but you will feel faster.","The bus driver knows every pothole on route nine. She steers around them without thinking, chats with the regulars, and still arrives right on time every day.","Light changes everything. The same street looks grey and tired at noon, gold and warm at sunset, and silver and strange under the orange lamps at midnight.","The crowd went quiet as the two cars lined up. One was old and loud, the other new and silent. When the light turned green, both shot off like arrows.","Spare parts pile up in every garage. Old wheels, a broken mirror, a box of bolts that fit nothing. Someday they might be useful, so nobody throws them out.","The park in the middle of the city is an island of green. Joggers loop the lake, kids feed the ducks, and the traffic noise fades to a soft and gentle hum.","Good tyres are worth more than a big engine. If the rubber cannot hold the road, all that power just turns into smoke and noise and a very slow start.","The radio announced the results at nine. The whole street cheered when they heard the name of the kid from the corner garage. He had finally done it, at last.","Some roads are made for speed and some are made for looking. The coast road is both, with long straights and a wide view of the sea around every single bend.","Before every race she taps the dashboard twice for luck. It is a silly habit and she knows it, but she has not lost a race since she started doing it.","The fuel station on the edge of town never closes. Truckers, taxi drivers and night racers all stop there for fuel, snacks and a few quiet minutes of rest.","Building a car takes patience. Parts arrive late, bolts snap, and nothing fits the first time. But the day it starts and drives, it all feels worth it.","The city has a sound of its own. Engines, sirens, footsteps, music from open windows, and under it all the low rumble of trains deep beneath the streets.","A drag race is over in seconds, but the work behind it takes months. Every part is chosen, tested and tuned so the car is ready for those few seconds.","Snow is rare here, but when it falls the city stops. The roads go white and quiet, schools close early, and everyone walks in the middle of the street.","The mechanic wiped her hands and smiled. The engine was running sweet and smooth at last. She closed the bonnet, tossed the keys over, and said good luck.","Win or lose, the drivers meet at the diner after the races. They share chips and stories, argue about gear ratios, and plan next week before going home.","The night before a big race the garage never sleeps. Someone is always bolting on a part, someone is always testing the lights, and someone is always making far too much coffee for everyone who is still awake.","The old tram line still runs along the river, slow and steady, past the warehouses and the new glass towers. Racers wait for it at the crossing, engines ticking over, and wave at the driver as the bell rings and it rolls by.","Tuning is a quiet art. Change one thing, test it, and write down what happened. A little more fuel, a little less weight, a slightly different gear. After a hundred small changes the car feels like a completely different machine.","Every district of the city has its own style. The harbour crews love loud old muscle cars, the uptown drivers polish their hatchbacks until they shine, and the kids from the tunnels build wild machines out of whatever they can find."],Jf=[`At 6:45 on Saturday morning, Marisol rolled her 1998 hatchback onto the scales: 1,042 kg, exactly. "Two kilos lighter than last week," she grinned, "and that's without the spare wheel!"`,`Race control's notice read: "Heats start at 19:30; finals at 21:15. Drivers must sign in by 18:45, wear an approved helmet, and keep their speed under 20 km/h in the pits."`,`Kenji's notebook was full of numbers: 3.21 final drive, 4,800 rpm launch, 29 psi in the fronts, 31 in the rears. Every page ended the same way - "Try again tomorrow, and write it all down."`,"The Harbour Bridge opened in 1931, closed for repairs in 1987, and reopened two years later with six lanes instead of four. Locals still argue about which version looked better.","Why do some drivers shift early? Nerves, mostly. The best advice I ever heard was simple: breathe out, count to two, and trust the lights; the car will do the rest for you.","Priya's shop, Voxel & Sons Tyres, has been on Quay Street since 1974. Her grandfather opened it with a single jack, three spanners and a loan of 400 pounds from his brother.","Weather update: light rain until 14:00, then clearing; winds from the north-west at 15-25 km/h. Track temperature should reach 28 degrees by the evening heats, perfect for grip.","The final was close - absurdly close. Dax crossed the line at 12.418 seconds; Halden at 12.421. Three thousandths! Neither of them believed it until they saw the replay twice.",`"Don't chase the redline," the old mechanic said, tapping the dial. "Find the torque, shift on the beat, and let the engine breathe." Then he went back to his coffee and crossword.`,"Route 9 runs 14 km from the depot to the airport, with 27 stops, 11 traffic lights and one level crossing that, according to every driver, is always closed when you're running late.","The rules are strict: no nitrous on the street, no racing after midnight, and absolutely no burnouts outside the bakery on Elm Road. Mrs. Okafor has complained 17 times this year.","Tuning tip #42: change one thing at a time. If you alter the gearing, tyre pressure and ride height in one go, you'll never know which change helped - or which one cost you 0.3 s.","On the night of the 2019 city final, the power failed at 21:07. Two hundred people held up their phones; the racers lined up anyway, lit only by headlights and a sea of tiny screens.","Sable's checklist, taped to the dash: fuel (half), tyres (warm), belts (tight), mirrors (set), mind (clear). She has used the same list for 9 years and lost only 3 races in that time.","The Downtown Grid isn't a real grid at all; it's a tangle of one-way streets, two roundabouts and a tunnel. Newcomers get lost; locals take the shortcut behind the old cinema.","Can a 120 hp hatchback beat a 400 hp coupe? Over 400 m, rarely. Over a twisty kilometre in the rain? Often! Power matters, but grip, weight and nerve matter just as much, if not more.",`Halden's first car cost 650 pounds, needed a new clutch, two tyres and a door, and leaked oil onto every driveway it visited. He still calls it "the best car I'll ever own."`,"By 23:30 the car park had emptied: a few last engines ticking as they cooled, a lone food truck closing its shutters, and Tamsin, still under her car, chasing one stubborn rattle.","Lap records at the old airfield: 58.2 s (1996), 55.9 s (2004), 54.1 s (2015). Nobody has gone under 54 since; some say the bumpy third corner simply won't allow it, however brave you are.",`The museum's newest exhibit is a battered rally sedan, still caked in mud from its last event. A small sign reads: "Please don't clean it - the dirt is part of the story."`],$f={easy:Wf,medium:Kf,hard:Jf},e_=[...Wf,...Kf,...Jf];var Ed=(i,e)=>e>0?i/5/(e/60):0,ml=class{constructor(e){this.text=e;X(this,"pos",0);X(this,"typo",!1);X(this,"keys",0);X(this,"errors",0);X(this,"finish",null);X(this,"lastHit",0);X(this,"nitros",Jt.nitros);X(this,"nitroAt",-99)}get done(){return this.pos>=this.text.length}get progress(){return this.pos/this.text.length}key(e,t){return this.done||e.length!==1?"ignored":(this.keys++,e===this.text[this.pos]?(this.pos++,this.typo=!1,this.lastHit=t,this.done&&(this.finish=t),"ok"):(this.errors++,this.typo=!0,"typo"))}nitro(e){if(this.done||this.nitros<=0)return"ignored";for(this.text[this.pos]===" "&&this.pos++;this.pos<this.text.length&&this.text[this.pos]!==" ";)this.pos++;return this.pos<this.text.length&&this , a login calendar, selling cars and garage slots",header:"Economy Update",added:["Daily tasks: three a day (new ones at midnight). Each pays Voxels and 2 Crowns, plus 3 Crowns for finishing all three.","Login calendar: claim one day each day; missed days don't reset. Crowns on days 7, 14 and 21, and a calendar-only paint (Champion teal) on day 28.","Sell cars in the Garage for half their price plus half of the upgrades you bought for them (click Sell, then Confirm).","Garage slots: 6 free, then 50 Crowns each. Boss cars don't take a slot and have their own Boss cars tab."],changed:["Visual parts now cost more in higher leagues and are bought once per league (for every car in that league). Parts you already own still fit every car.","Typing Races pay more in higher leagues, so they earn about the same per minute as Street Races.","Strip boss cash lowered (1,000 VX \xD7 boss number \xD7 league, was 2,500) so leagues last longer."]},{version:"0.8.2",date:"2026-10-19",title:"Faster publishing and an economy checker (behind the scenes)",added:['Behind the scenes: one-click "Ship It" that checks the game, runs the smoke test and publishes it to the website.',"Behind the scenes: an economy checker that shows money per minute for each race type and how long each league takes."],fixed:["Behind the scenes: the code check runs cleanly again on the PC."]},{version:"0.8.0",date:"2026-10-19",title:"Grilles, window tint, front plate text and a tidier Body Shop",header:"Tint & Grille Update",added:["Grille parts: Slats, Mesh, Chrome bars, Framed and Shaved (styles that do not fit a car are hidden).","Window tint: Light, Dark, Limo, Blue mirror and Gold mirror.","Your plate text now shows on the front plate too (front plates are 2 blocks tall).","The car turns on the turntable to show the part you are looking at (rear for tail lights and plates, nose for headlights and grilles, side for wheels). Drag it to look around yourself."],changed:["Body Shop tabs are grouped: Paint \xB7 Wheels \xB7 Aero \xB7 Lights \xB7 Details.","Paint is a compact swatch grid like the Catalog: standard paints, then premium. Yellow = selected, white = on the car.","The Spin button icon is full size, like the other buttons.","Garage: Drive / Body Shop / Upgrade are now small sub-tabs that pop up above the Garage button for the car you pick."],fixed:["Fitted quad / round tail lights no longer hang off the side of cars with narrow tall lamps (Supermini and others). The collision check now also catches blocks hanging off the nose or tail."]},{version:"0.7.0",date:"2026-10-19",title:"Body Shop: paint, plates, lights, mirrors, roof parts and more",header:"Body Shop Update",added:["Parts is now the Body Shop (Garage \u2192 pick a car \u2192 Body Shop).","Paint tab: your first paint is picked free when you buy a car. A repaint costs VX (more in higher leagues). 8 premium paints are bought once with Crowns, then free on every car.","License plates: 5 pre-made designs (City, Classic, Euro, Race, Gold) and your own text on the rear plate \u2014 up to 7 letters/numbers, 10 Crowns per change.","Roof parts: roof scoop, twin roof scoops and a roof rack.","Side exhaust: pipes under the doors, just ahead of the rear wheels (side skirts stop short of them).","5 new wheels: Deep dish, Blade, Rally disc, Bronze seven and Wire spoke (Crowns).","Headlights (9 styles, including pop-ups on low-nosed cars only), Taillights (6 styles, including Smoked) and Mirrors (Body colour, Black, Chrome, Carbon or Shaved).","Spin toggle beside Profile turns the garage turntable on or off, and you can drag a car with the mouse to turn it."],changed:["The Catalog only picks paint for cars you are buying; owned cars are repainted in the Body Shop.","Styles that do not fit a car are hidden for it, and rival cars only wear parts that fit them.","Cars build about 4\xD7 faster (Garage cards and race loading)."],fixed:["Collision check on every car and part: tail pipes no longer cut through diffusers or the plate, ducktails sit above full-width tail lights, GT wing legs no longer go through the rear glass, and fitted headlights no longer overlap grilles."]},{version:"0.6.1",date:"2026-10-19",title:"Controls + per-car records",added:["Settings \u25B8 Controls: change your keys, with a Drag Race set (gas / shift up, shift down) and a Typing Race set (nitro, leave the race). Click a key, then press the new one; a key already in use swaps places. Reset puts the defaults back.","Garage: each car now shows its own races, wins and best 600 / 700 / 800 m times (counted from this update)."],changed:["Typing Race nitro is now Enter (it can be changed in Settings \u25B8 Controls), so a Space can never fire it by accident. Enter on a space finishes the next word.","Drag Race key hints show the keys you picked."]},{version:"0.6.0",date:"2026-10-19",header:"Garage Update",title:"Garage polish, Car Lab and faster tools",added:["Car Lab (developers only: test console \u25B8 Car Lab): design a car with sliders for every body setting, start from any car, try paint and decals, and export the settings to send in.","Big updates now get a header in the patch notes (this one: Garage Update).","Developer tools: one-command release check (version must go up), a quick smoke test of every screen, and a review-shot tool."],changed:["Garage: the camera pulls back so the whole car fits between your car list and the stats box.","Garage: Drive / Parts / Upgrade connect to the picked car with a blocky connector in the game's panel style."]},{version:"0.5.0",date:"2026-10-19",title:"Garage",added:["Garage tab: all your cars in a list on the left, the picked car on the turntable, and a stats box beside it.","Pick a car and three buttons pop out beside its card: Drive (race in it), Parts (its looks) and Upgrade (engine and gearbox). Parts and Upgrade work on that car even if you are driving another one.","Stat bars show the car's stock value in grey, what your upgrades add in green, and any trade-off in red orward. A wrong key turns that letter red and holds you until you type the right one; your car rolls to a stop meanwhile.","Start lamps light one by one, then GO (steady lamps, no blinking). Live WPM, accuracy, place and time while you type; each car has a name tag with its live WPM; a progress bar shows the whole race.","Rivals type at speeds matched to your average WPM (your last 10 Typing Races), using the Easy / Medium / Hard picker: typing at your average just wins on Medium.","Pay by place (League D Medium win 1,000 VX, scaled by your car's league and the difficulty), plus bonuses for a new best WPM and 98%+ accuracy.","44 original passages about the city, its cars and its people.","Profile shows your best WPM, average WPM and Typing Race wins.","Esc leaves a Typing Race."],changed:["Typing speed is all that matters in a Typing Race. The car you drive is for looks (your paint, decals and parts show from above)."]},{version:"0.2.1",date:"2026-10-19",title:"Update notice",added:['Update notice: when a newer version is published on the website, the garage (or results screen) shows "Update ready" with Refresh now / Later. Refresh saves and reloads into the new version as a new session; your progress is kept. It never pops up during a race.','After an update, the first garage visit says "Updated to V\u2026" and the Patch notes button shows NEW.',"Every build now writes version.json next to the game, which the website version checks every 2 minutes and whenever you come back to the tab."],fixed:["Opening the website straight after an upload could keep showing the old version from the browser's cache. Refresh now loads a fresh copy."]},{version:"0.2.0",date:"2026-10-19",title:"Parts v2: Decals, Underglow, Body kit",added:["Decals tab: Side stripe, Checker band, Race number, Racing stripes and Flames. Stripe colours pick white or black to stand out on your paint.","Boss decals: the decal from every Strip boss (Rook, Brass, Viper, Nova, Apex \xB7 I \u2013 VI) now shows in Decals once won, and fits for free. Emblem on both doors and the hood.","Underglow tab: Ice blue, Neon green, Violet, Red, Hot pink, White and a blue / pink Two-tone. Steady glow, never blinks or pulses.","Body kit tabs: Front bumper (Front lip, Aero bumper, Track splitter), Side skirts (Black, Body-colour, Carbon) and Rear diffuser (Street, Race).","Rivals now wear random visual parts (spoilers, wheels, decals, underglow \u2026). Looks only, no effect on speed.","New part-card close-ups for the side, nose, sills and underside."],changed:[`Parts no longer sells what your car already has: a part that matches the car's factory part is folded into its Factory card (e.g. "Factory \xB7 GT wing" on the Tuner coupe).`,"Vented hood is subtler: slim dark slots set into the hood, kept inside the front fenders on every car.","Carbon hood covers only the hood panel, not the raised fenders over the wheels."],fixed:["Hood vents clipped through the wheel arches / fenders on some cars."]},{version:"0.1.2",date:"2026-10-19",title:"Race button fix",changed:["The Race button now closes whatever is open (Profile, Upgrades, Parts, Catalog, Settings, the Strip or Patch notes) and opens the race menu on its own."],fixed:["Opening the race menu while another panel (e.g. Parts) was open showed both at once, with the race menu behind."]},{version:"0.1.1",date:"2026-10-19",title:"Patch notes + web build",added:["Patch notes: the paper button at the bottom-left of the garage lists every version's additions, changes, fixes and removals.","The button shows NEW until you have read the latest notes.","Web build: the game now builds an index.html next to VoxelCity.html, so the GitHub Pages link opens the game directly."],fixed:["GitHub Pages link opened an empty page (the site had no index.html)."]},{version:"0.1.0",date:"2026-10-19",title:"First playable builds (Oct 16 \u2013 19)",added:["Drag racing: hold to rev, launch on green, timed up-shifts with Perfect / Good / Early / Late grades, down
