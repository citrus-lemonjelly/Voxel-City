:root{--bg:#14161c;--panel:#1d2029;--panel2:#252935;--edge:#3a3f4d;--text:#e9ecf2;--dim:#9aa3b5;--accent:#f2c230;--good:#4ade80;--bad:#ef5350;--amber:#f2a43a;--blue:#5aa9ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
#stage{position:fixed;inset:0}
.hd{font-family:"Courier New",ui-monospace,monospace;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.blk{background:var(--panel);box-shadow:0 0 0 3px var(--edge),6px 6px 0 3px #0b0c10}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;color:#14161c;background:var(--accent);padding:12px 22px;font:900 18px "Courier New",monospace;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 0 0 3px #b8901c,4px 4px 0 3px #0b0c10}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 3px #b8901c,2px 2px 0 3px #0b0c10}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:0 0 0 3px var(--edge),4px 4px 0 3px #0b0c10}
.overlay{position:fixed;inset:0;pointer-events:none}
.overlay>*{pointer-events:auto}
/* garage terminal */
#terminal{position:absolute;right:28px;top:28px;bottom:28px;width:430px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow:auto}
#terminal .screen-title{font-size:13px;color:var(--dim)}
#terminal h1{margin:0;font-size:28px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.voxels{color:var(--accent);font:900 22px "Courier New",monospace}
.crowns{color:#e8c46a;font:900 16px "Courier New",monospace;display:inline-flex;align-items:center;gap:4px}.crown-ic{display:inline-flex;color:#e8c46a;--accent:#b8901c;margin-right:3px;vertical-align:-2px}
.btn .crown-ic{color:#14161c;--accent:#14161c}
.cat-tag.cr{color:#e8c46a;display:inline-flex;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel2);padding:8px 10px;box-shadow:0 0 0 2px var(--edge)}
.stat b{display:block;font:900 20px "Courier New",monospace}
.stat span{font-size:12px;color:var(--dim)}
.upg h3{margin:4px 0 6px;font-size:14px}
.upg .desc{font-size:12px;color:var(--dim);margin-bottom:6px;min-height:16px}
.g-panel.g-upg{gap:9px}.g-upg h2{margin:0}
.upg-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}.upg-hd h3{margin:0;font-size:13px;flex:none;width:104px}
.upg-hd .desc{margin:0;min-height:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-upg .tier{padding:4px 2px;font-size:11px;gap:0}.g-upg .tier b{font-size:14px}
.tiers.g3{grid-template-columns:repeat(3,1fr)}.g-upg .tier.gear{padding:7px 2px}.g-upg .tier.gear b{font-size:13px;text-transform:uppercase}
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tier{border:0;padding:8px 2px;cursor:pointer;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font:700 12px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px}
.tier b{font:900 16px "Courier New",monospace}
.tier.equipped{background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}
.tier.owned{box-shadow:0 0 0 2px var(--accent)}
.tier.locked{opacity:.45;cursor:not-allowed}
.settings h3{margin:4px 0 6px;font-size:14px}
.setrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin:4px 0}
.seg{display:flex;gap:4px}
.seg button{border:0;padding:5px 8px;cursor:pointer;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font:700 11px system-ui}
.seg button.on{background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}
.next{background:var(--panel2);padding:10px 12px;box-shadow:0 0 0 2px var(--edge);font-size:13px}
.spacer{flex:1}
#terminal .btn.race{font-size:24px;padding:16px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:118px;padding:10px 14px;font-size:14px;z-index:6;pointer-events:none}
.catalog-mode ~ .toast,.strip-mode ~ .toast{bottom:auto;top:36px}
/* ---- Garage HUD (owner 2026-10-18) ---- */
#garage{position:absolute;inset:0;pointer-events:none}
#garage>*{pointer-events:auto}
.g-title .screen-title{font-size:13px;color:var(--dim)}
.g-stats{display:flex;gap:14px;font-size:12px;color:var(--dim)}.g-stats b{color:var(--text);font:900 15px "Courier New",monospace}
.g-tabwrap{position:relative;display:flex}
.g-sub{position:absolute;left:50%;bottom:calc(100% + 22px);transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;background:#14161cf0;white-space:nowrap;z-index:6}
.g-sub-name{font:900 11px 'Courier New',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:0 6px 0 2px}
.g-subtab{border:0;cursor:pointer;height:30px;padding:0 12px;background:var(--panel2);color:var(--text);box-shadow:0 0 0 2px var(--edge);font:900 12px 'Courier New',monospace;letter-spacing:.08em;text-transform:uppercase}
.g-subtab:hover:not(:disabled){box-shadow:0 0 0 2px var(--accent)}
.g-subtab.drive{background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}
.g-subtab:disabled{cursor:default;opacity:.6}
canvas.grab{cursor:grab}canvas.grabbing{cursor:grabbing}
@keyframes rb-spin{to{transform:rotate(360deg)}}
.g-racebtn:hover .rb-wheel{animation:rb-spin .9s linear infinite}
.g-racebtn:hover .rb-gear{animation:rb-spin 1.6s linear infinite reverse}
@media (prefers-reduced-motion:reduce){.g-racebtn .rb-ic{animation:none!important}}
/* update notice (owner V0.2.1): static, top centre, above everything */
.upd{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;padding:12px 16px;max-width:820px;width:max-content}
.upd-txt{display:flex;flex-direction:column;gap:2px}.upd-txt .hd{color:var(--accent);font-size:16px}.upd-txt span{font-size:12.5px;color:#cfd3dc}
.upd .btn{font-size:14px;padding:9px 14px;white-space:nowrap}
.g-new{position:absolute;top:-9px;right:-12px;font:900 9px system-ui;letter-spacing:.08em;text-transform:uppercase;font-style:normal;padding:2px 5px;background:var(--accent);color:#14161c;box-shadow:0 0 0 2px #b8901c}
.pn-ver{padding:12px 14px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge)}
.pn-ver.big{box-shadow:0 0 0 2px var(--accent)}.pn-banner{margin:-12px -14px 10px;padding:8px 14px;background:var(--accent);color:#14161c;font-size:15px;letter-spacing:.1em}
.pn-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.pn-head .hd{color:var(--accent);font-size:18px}
.pn-head span{flex:1;font-weight:700;font-size:13px}.pn-head time{font-size:11px;color:var(--dim)}
.pn-kind{font:800 11px system-ui;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 2px}
.pn-added{color:var(--good)}.pn-changed{color:var(--blue)}.pn-fixed{color:var(--amber)}.pn-removed{color:var(--bad)}
.pn-ver ul{margin:0;padding-left:18px;font-size:12.5px;color:#cfd3dc}.pn-ver li{margin:2px 0}
.g-racemenu{position:absolute;right:28px;bottom:104px;display:flex;flex-direction:column;gap:10px;width:330px}
.g-mode{border:0;text-align:left;cursor:pointer;color:var(--text);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.g-mode .hd{font-size:20px;color:var(--accent)}
.g-mode-sub{grid-column:1;font-size:12px;color:var(--dim)}
.g-go{grid-row:1/3;grid-column:2;font:900 18px "Courier New",monospace;color:var(--good)}
.g-mode.off{cursor:default;opacity:.75}.g-mode.off .hd{color:var(--dim)}
.g-soon{grid-row:1/3;grid-column:2;font:800 11px system-ui;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge);color:var(--amber)}
.g-panel{position:absolute;right:28px;top:110px;bottom:104px;width:440px;padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.g-panel h2{margin:0;font-size:22px}

  </div>`);n.appendChild(r),r.querySelector("#again").addEventListener("click",t.again),r.querySelector("#toGarage").addEventListener("click",t.garage)}var Da=[{version:"0.17.0",date:"2026-10-22",title:"Tune every gear",header:"Gearbox Update",added:["Gear ratio tuning: own Transmission T5 and a Gear ratios drop-down opens under the Transmission row. Tune each gear on its own \u2014 \u2212 for a taller gear (more speed), + for a shorter one (more pull) \u2014 and see each gear's top speed.","Each gear can move up to 25% from stock and always stays taller than the gear before it. Reset puts the stock ratios back. Saved per car.","Test run uses your tuned ratios, so you can tune and test straight away."]},{version:"0.16.2",date:"2026-10-22",title:"Hypercar gearing and a cleaner engine sound",changed:["League S gearboxes are taller with progressive spacing: a maxed hypercar now uses its 8 gears across the whole run (8th comes at about 7.5 s, not 4) and stops sitting on the rev limiter \u2014 it is quicker too.","League A gearboxes use progressive spacing (bigger steps in the low gears, closer at the top)."],fixed:["The muscle car engine sounded like a blown speaker: it played notes too low for speakers (down to 6 Hz). Engine notes now stay above 45 Hz, the muscle car keeps its deep rumble, and a limiter stops any sound from clipping.","A maxed hypercar shifted from 2nd to 8th in under 3 seconds."]},{version:"0.16.1",date:"2026-10-22",title:"Fair end game and more gears",changed:["League A cars now have up to 7 gears and League S cars up to 8 (stock 6- and 7-speeds), with closer ratios and quicker shifts.","Nitrous description says when to use it: once the tyres grip (3rd gear on) \u2014 fired at the launch it only spins the wheels."],fixed:["Rivals were matched as if you launched the instant the light went green, so even a perfect driver (all Perfect shifts, maxed car) kept losing, worst in the short League S races. Rivals are now matched to a realistic reaction \u2014 a perfect run wins again.","Rivals no longer leave the line before their own reaction time.","Your perfect-run reference no longer assumes perfect nitrous: using it well now puts you further ahead instead of being expected.","The last Strip boss in each league now loses to a perfect run by a clearer margin."]},{version:"0.16.0",date:"2026-10-22",title:"Sound, smoke, rain and nitrous",header:"Feel Update",added:["Sound: engine notes that rise with the revs, shift clunks, launch screech, a chime on Perfect shifts, countdown beeps, Typing Race key clicks and a win / lose jingle. Each kind of car sounds different \u2014 a muscle car rumbles, a tuner rasps, a hypercar screams.","Settings \u25B8 Sound volume and Engine volume (Off, 25, 50, 75, 100).","Nitrous: a new upgrade (T2\u2013T5). One shot per race \u2014 press 1, or tap the bottle badge by the gauge. Stronger and longer at higher tiers. Some rivals carry it too.","Voxel effects: tyre smoke on the launch and in wheelspin, a backfire flame on Perfect shifts, a blue flame while nitrous burns, dust at the finish.","Rain in about one race in four: falling rain, a wet shiny road, spray from the wheels \u2014 and less grip for both cars, so go easy on the launch.","Night and dusk rain: street lights and headlights reflect in long streaks on the wet road.","Shift light: the rim of the rev gauge glows green while the revs are in the shift zone.","A camera kick on the launch, a wider view while nitrous burns, and a slow-motion photo finish when the race is too close to call.","Upgrades \u25B8 Test run: race your set-up on an empty strip and see 0\u201360, 600 m and 800 m on each gearing \u2014 after a change it shows how much quicker you got."],changed:["The Upgrades panel is compact: part names down the left, T1\u2013T5 beside them. Point at a tier to see what it does and what it costs.","The race progress bar uses the same track and chequered flag as the Typing Race.","League D upgrades cost about a third less and League S upgrades a little more, so every league takes its intended time.","Small labels (like the New badge) are a bit bigger."]},{version:"0.15.0",date:"2026-10-22",title:"Type on your phone",header:"Phone Typing Update",added:["Typing Race on phones: the phone keyboard opens when the race starts, and the screen fits above it. Tap the race to bring the keyboard back.","Phones: Nitro and Leave buttons in the Typing Race (phone keyboards have no Esc key).","Add Voxel City to your phone's home screen: it opens full screen and sideways, with its own voxel car icon. Settings shows how on phones.","Settings \u25B8 Graphics: Auto, Full or Light. Light (the default on phones) draws fewer pixels, smaller shadows and no speed blur, so races run smoother.","A pop-up on the race results when a Strip level gives you a new car or decal."],changed:["Race screen: the progress bar is now a dotted line across the top centre, with your car and your rival drawn from above in their own paint.","The start lights fade away a second after green, so the top of the race screen stays clear.","PC: Profile, Garage, Catalog and the small buttons sit up the left side again, always shown (phones keep the Menu button).","The Garage buttons (Drive, Body Shop, Upgrade, Sell) run along the bottom beside Settings, on the home screen too, for the car you drive.","Phones: everything is drawn a little bigger, and the smallest labels a size up."],removed:['The "X is 0.2 s ahead" line and the panel behind the race progress bar.',"The Menu button on PC (the side buttons are always shown there)."]},{version:"0.14.0",date:"2026-10-21",title:"Every screen fits your phone",header:"Phone Update",added:["Every menu, result and Typing Race screen now fits small screens and phones: it shrinks to fit, and long panels scroll inside.","Strip rewards are added automatically when you clear a level (they show on the race results)."],changed:["Open screens (My cars, Catalog, Body Shop, Settings\u2026) now sit on top of the other buttons instead of under them.","The Settings button sits beside Patch notes; the camera is a small icon beside the Race button.","The car card in the top-left corner moved into Profile (league, name, hp, shifts, shift time, redline), so the garage screen is clearer.","The Strip is much smaller: each level shows only its number and the money it pays. Tap the yellow card to race the next level.","Phone buttons are a more comfortable size (they shrink with the screen).","The Typing Race text panel grows to fit, so the stats row is never cut off."],removed:["Claim buttons in the Strip (rewards are automatic now).","Distance and rival details on Strip cards (you meet your rival on the start line).","Settings and the camera button from the side menu (they have their own spots now)."]},{version:"0.13.1",date:"2026-10-21",title:"The race screen gets the new look",added:["Clicking anywhere outside the side bar, or pressing Esc, closes it (the click still does what you meant).","Phones: the menu opens as a row of big buttons just above the Menu button, so it fits on a sideways screen."],changed:["Race screen: the dash plate behind the gauge, paddles and pedal is now a lit block like the menus, and so are the race strip and the start lights.","Phones and tablets: the Menu, Patch notes, camera and side bar buttons are bigger and easier to tap.","Behind the scenes: the menu styles were tidied into one place, so future changes are quicker."],removed:["The old menu look (it could only be reached with a test address)."]},{version:"0.13.0",date:"2026-10-21",title:"A new coat for every menu",header:"Style Update",added:["A Menu button in the bottom-left corner: it opens a side bar with Profile, Garage, Catalog, Settings and the four small buttons, and closes again when you pick one.","A yellow dot on the Menu button when a Daily task or calendar day is ready to claim.","Panel titles now have their own icon and a title strip with the close button."],changed:["New look for every menu: panels and buttons are lit blocks like the cars, pressed and chosen buttons sink in, and yellow now only marks what you can act on.","Titles and big numbers use a pixel font (built into the game, works offline); the rest uses a cleaner, easier-to-read font.","The car card shows the league as a yellow tag and three key stats; the wallet shows VX and Crowns as two separate blocks.","Patch notes and the camera button sit beside the Menu button; the Garage tabs (Drive, Body Shop, Upgrade, Sell) sit beside them.","Screens on the left slide aside while the side bar is open, so nothing is covered.","Small labels are bigger (11 px and up)."],fixed:['Small labels at the end of some panel titles (like "Current V\u2026") were hidden; they show now.'],removed:["The best time in the wallet corner (it is still in Profile and on the race results)."]},{version:"0.12.0",date:"2026-10-21",title:"Hold the gas yourself",header:"Pedal Update",added:["Pedal mode (Settings \u25B8 Controls \u25B8 Drive mode): the gas pedal stays all race. Hold it to pull, let go to coast. Tap shift up on green to launch.","Shift up has its own key in Pedal mode (\u2191 by default, change it in Controls).","Pedal mode: lift off the gas for a moment during wheelspin to get the grip back.","Phone race screen: gauge in the middle, a small \u2212 + paddle pair in one bottom corner and the gas pedal in the other, with big thumb areas.","Pedal side setting for phones: gas on the right (default) or on the left.","Phones buzz briefly on a Perfect shift (can be turned off in Controls; iPhones don't support it).",'Phones show "Turn your phone sideways" when held upright.'],changed:["The Race button is smaller and blocky, with a wheel and a gear that turn when you point at it.","Classic controls stay the default and work exactly as before."]},{version:"0.11.0",date:"2026-10-21",title:"Tyres, weight, turbo and gearing",header:"Tuning Update",added:["Three new upgrades for every car, T1\u2013T5 in each league: Tyres (more grip and an easier perfect launch), Weight (a lighter car) and Turbo (more power high in the revs, a little less down low, and a little extra weight).","Gearing for every car, free to change in Upgrades: Short (harder launch, runs out of revs sooner), Balanced (factory) or Long (softer launch, more top speed). Stock cars like Short; fully upgraded cars often need Long so they don't hit the rev limiter before the line.","Boss cars can change their gearing too (their parts still come as they are)."],changed:["Rivals now carry all five parts, each at a random tier near your own level, and a random gearing, so no two rivals are set up the same.","The Strip's top rungs expect a fully upgraded car on the right gearing for the race length.","Upgrades in Leagues C and B are a little gentler so a fully upgraded car never beats a stock car of the next league.","Boss cars of Leagues D and B got a little more power so they keep their head start in the next league.","The Garage list shows how many upgrade steps a car has (for example Upgrades 6/20).","Selling a car pays back half of every part bought for it, not just the engine and gearbox."]},{version:"0.10.1",date:"2026-10-20",title:"One way to Upgrades",changed:["Upgrades open from the Garage: press Garage, then Upgrade, for the car you picked."],removed:["The separate Upgrades button on the bottom bar (it did the same thing as Garage \u25B8 Upgrade)."]},{version:"0.10.0",date:"2026-10-20",title:"A real garage behind the menus",header:"Garage Room Update",added:["The menus now sit in a full 3D garage: your car on a showcase turntable with a lit ring, a loft upstairs, an office nook with the Garage Terminal, and a mechanic bay.","Loft lounge: couch, TV, bookshelves, posters, a mini fridge, plants, and a racing jacket over the railing.","Mechanic bay: a two-post lift with a stripped body shell in primer, a red toolbox, pegboard of tools, workbench, tyre stacks, rims on the wall, an engine on a stand, oil drums and a compressor.","A roll-up door with the street outside (parked car, lamp post, a diner across the road).","Garage door button in the small button block beside Profile (the spare slot): open or close the roll-up door.","Camera button beside Patch notes: four garage camera angles \u2014 A High, B Low, C Hero, D Wide (the new default, shows the loft).","Upgrades turns the camera toward the mechanic bay; Profile turns it toward the loft.","Test console: race time of day \u2014 Random, or force Day / Dusk / Night."],changed:["The plain grey checker floor and block wall are gone; the turntable has a new look.","Every race now picks its time of day at random (day, dusk or night).","Behind the scenes: each garage panel now has its own file, so new features are quicker to add and fix."],removed:["Time of day is no longer in Settings (it moved to the test console)."]},{version:"0.9.1",date:"2026-10-19",title:"Mini buttons beside Profile and a quicker Garage",added:["A small 2\xD72 button block beside Profile: Spin, Daily, Calendar and a spare slot for later. A yellow dot means something is ready to claim.","The login calendar has its own button and panel."],changed:["Opening the Garage shows Drive / Body Shop / Upgrade / Sell straight away for the car you are driving. Click another car to switch.","Spin moved from its own big button into the new button block."]},{version:"0.9.0",date:"2026-10-19",title:"Daily tasks, a login calendar, selling cars and garage slots",header:"Economy Update",added:["Daily tasks: three a day (new ones at midnight). Each pays Voxels and 2 Crowns, plus 3 Crowns for finishing all three.","Login calendar: claim one day each day; missed days don't reset. Crowns on days 7, 14 and 21, and a calendar-only paint (Champion teal) on day 28.","Sell cars in the Garage for half their price plus half of the upgrades you bought for them (click Sell, then Confirm).","Garage slots: 6 free, then 50 Crowns each. Boss cars don't take a slot and have their own Boss cars tab."],changed:["Visual parts now cost more in higher leagues and are bought once per league (for every car in that league). Parts you already own still fit every car.","Typing Races pay more in higher leagues, so they earn about the same per minute as Street Races.","Strip boss cash lowered (1,000 VX \xD7 boss number \xD7 league, was 2,500) so leagues last longer."]},{version:"0.8.2",date:"2026-10-19",title:"Faster publishing and an economy checker (behind the scenes)",added:['Behind the scenes: one-click "Ship It" that checks the game, runs the smoke test and publishes it to the website.',"Behind the scenes: an economy checker that shows money per minute for each race type and how long each league takes."],fixed:["Behind the scenes: the code check runs cleanly again on the PC."]},{version:"0.8.0",date:"2026-10-19",title:"Grilles, window tint, front plate text and a tidier Body Shop",header:"Tint & Grille Update",added:["Grille parts: Slats, Mesh, Chrome bars, Framed and Shaved (styles that do not fit a car are hidden).","Window tint: Light, Dark, Limo, Blue mirror and Gold mirror.","Your plate text now shows on the front plate too (front plates are 2 blocks tall).","The car turns on the turntable to show the part you are looking at (rear for tail lights and plates, nose for headlights and grilles, side for wheels). Drag it to look around yourself."],changed:["Body Shop tabs are grouped: Paint \xB7 Wheels \xB7 Aero \xB7 Lights \xB7 Details.","Paint is a compact swatch grid like the Catalog: standard paints, then premium. Yellow = selected, white = on the car.","The Spin button icon is full size, like the other buttons.","Garage: Drive / Body Shop / Upgrade are now small sub-tabs that pop up above the Garage button for the car you pick."],fixed:["Fitted quad / round tail lights no longer hang off the side of cars with narrow tall lamps (Supermini and others). The collision check now also catches blocks hanging off the nose or tail."]},{version:"0.7.0",date:"2026-10-19",title:"Body Shop: paint, plates, lights, mirrors, roof parts and more",header:"Body Shop Update",added:["Parts is now the Body Shop (Garage \u2192 pick a car \u2192 Body Shop).","Paint tab: your first paint is picked free when you buy a car. A repaint costs VX (more in higher leagues). 8 premium paints are bought once with Crowns, then free on every car.","License plates: 5 pre-made designs (City, Classic, Euro, Race, Gold) and your own text on the rear plate \u2014 up to 7 letters/numbers, 10 Crowns per change.","Roof parts: roof scoop, twin roof scoops and a roof rack.","Side exhaust: pipes under the doors, just ahead of the rear wheels (side skirts stop short of them).","5 new wheels: Deep dish, Blade, Rally disc, Bronze seven and Wire spoke (Crowns).","Headlights (9 styles, including pop-ups on low-nosed cars only), Taillights (6 styles, including Smoked) and Mirrors (Body colour, Black, Chrome, Carbon or Shaved).","Spin toggle beside Profile turns the garage turntable on or off, and you can drag a car with the mouse to turn it."],changed:["The Catalog only picks paint for cars you are buying; owned cars are repainted in the Body Shop.","Styles that do not fit a car are hidden for it, and rival cars only wear parts that fit them.","Cars build about 4\xD7 faster (Garage cards and race loading)."],fixed:["Collision check on every car and part: tail pipes no longer cut through diffusers or the plate, ducktails sit above full-width tail lights, GT wing legs no longer go through the rear glass, and fitted headlights no longer overlap grilles."]},{version:"0.6.1",date:"2026-10-19",title:"Controls + per-car records",added:["Settings \u25B8 Controls: change your keys, with a Drag Race set (gas / shift up, shift down) and a Typing Race set (nitro, leave the race). Click a key, then press the new one; a key already in use swaps places. Reset puts the defaults back.","Garage: each car now shows its own races, wins and best 600 / 700 / 800 m times (counted from this update)."],changed:["Typing Race nitro is now Enter (it can be changed in Settings \u25B8 Controls), so a Space can never fire it by accident. Enter on a space finishes the next word.","Drag Race key hints show the keys you picked."]},{version:"0.6.0",date:"2026-10-19",header:"Garage Update",title:"Garage polish, Car Lab and faster tools",added:["Car Lab (developers only: test console \u25B8 Car Lab): design a car with sliders for every body setting, start from any car, try paint and decals, and export the settings to send in.","Big updates now get a header in the patch notes (this one: Garage Update).","Developer tools: one-command release check (version must go up), a quick smoke test of every screen, and a review-shot tool."],changed:["Garage: the camera pulls back so the whole car fits between your car list and the stats box.","Garage: Drive / Parts / Upgrade connect to the picked car with a blocky connector in the game's panel style."]},{version:"0.5.0",date:"2026-10-19",title:"Garage",added:["Garage tab: all your cars in a list on the left, the picked car on the turntable, and a stats box beside it.","Pick a car and three buttons pop out beside its card: Drive (race in it), Parts (its looks) and Upgrade (engine and gearbox). Parts and Upgrade work on that car even if you are driving another one.","Stat bars show the car's stock value in grey, what your upgrades add in green, and any trade-off in red (e.g. shorter gears cost a little top speed).",'Favourites: tap \u2605 on a car to pin it to the top; "Favourites only" shows just those.'],changed:["The Parts tab moved into the Garage (per car). The bottom bar is now Profile \xB7 Garage \xB7 Upgrades \xB7 Catalog \xB7 Settings.","Upgrades on the bottom bar still work on the car you are driving."]},{version:"0.4.0",date:"2026-10-19",title:"Nitro + passages by difficulty",added:["Nitro in the Typing Race: two nitro bars per race. Press Space in the middle of a word to use one: the rest of the word finishes at once and your car surges ahead with a steady blue-and-orange flame. It also clears a red letter. Nitro letters don't count against your accuracy.","With no nitro left, Space in the middle of a word is a normal typo. Space between words still just types the space.","Easy, Medium and Hard now have their own passages: Easy = 20 short passages with simple words; Medium = the 44 everyday passages; Hard = 20 longer passages with names, numbers, times, quotes and harder punctuation."],changed:["Rivals are matched to your average for that difficulty (Hard text is slower for everyone). Until you have 3 races at a difficulty, it starts from your overall average, adjusted for the text.","The race menu and results show your average for the difficulty you picked."]},{version:"0.3.1",date:"2026-10-19",title:"Typing Race: cars glide",changed:["Typing Race cars now have momentum: when you stop typing (or hit a typo) your car glides on and eases to a stop instead of stopping dead. Rivals move the same way. A car never drives past the letters typed.","After the last letter, the results wait a moment longer so your car can roll over the finish line."]},{version:"0.3.0",date:"2026-10-19",title:"Typing Race",added:["Typing Race (Race \u25B8 Typing Race): a Nitro Type-style race seen from straight above. Five cars in five lanes on a voxel street; the camera follows your car.","Type the passage to drive: every correct key moves you forward. A wrong key turns that letter red and holds you until you type the right one; your car rolls to a stop meanwhile.","Start lamps light one by one, then GO (steady lamps, no blinking). Live WPM, accuracy, place and time while you type; each car has a name tag with its live WPM; a progress bar shows the whole race.","Rivals type at speeds matched to your average WPM (your last 10 Typing Races), using the Easy / Medium / Hard picker: typing at your average just wins on Medium.","Pay by place (League D Medium win 1,000 VX, scaled by your car's league and the difficulty), plus bonuses for a new best WPM and 98%+ accuracy.","44 original passages about the city, its cars and its people.","Profile shows your best WPM, average WPM and Typing Race wins.","Esc leaves a Typing Race."],changed:["Typing speed is all that matters in a Typing Race. The car you drive is for looks (your paint, decals and parts show from above)."]},{version:"0.2.1",date:"2026-10-19",title:"Update notice",added:['Update notice: when a newer version is published on the website, the garage (or results screen) shows "Update ready" with Refresh now / Later. Refresh saves and reloads into the new version as a new session; your progress is kept. It never pops up during a race.','After an update, the first garage visit says "Updated to V\u2026" and the Patch notes button shows NEW.',"Every build now writes version.json next to the game, which the website version checks every 2 minutes and whenever you come back to the tab."],fixed:["Opening the website straight after an upload could keep showing the old version from the browser's cache. Refresh now loads a fresh copy."]},{version:"0.2.0",date:"2026-10-19",title:"Parts v2: Decals, Underglow, Body kit",added:["Decals tab: Side stripe, Checker band, Race number, Racing stripes and Flames. Stripe colours pick white or black to stand out on your paint.","Boss decals: the decal from every Strip boss (Rook, Brass, Viper, Nova, Apex \xB7 I \u2013 VI) now shows in Decals once won, and fits for free. Emblem on both doors and the hood.","Underglow tab: Ice blue, Neon green, Violet, Red, Hot pink, White and a blue / pink Two-tone. Steady glow, never blinks or pulses.","Body kit tabs: Front bumper (Front lip, Aero bumper, Track splitter), Side skirts (Black, Body-colour, Carbon) and Rear diffuser (Street, Race).","Rivals now wear random visual parts (spoilers, wheels, decals, underglow \u2026). Looks only, no effect on speed.","New part-card close-ups for the side, nose, sills and underside."],changed:[`Parts no longer sells what your car already has: a part that matches the car's factory part is folded into its Factory card (e.g. "Factory \xB7 GT wing" on the Tuner coupe).`,"Vented hood is subtler: slim dark slots set into the hood, kept inside the front fenders on every car.","Carbon hood covers only the hood panel, not the raised fenders over the wheels."],fixed:["Hood vents clipped through the wheel arches / fenders on some cars."]},{version:"0.1.2",date:"2026-10-19",title:"Race button fix",changed:["The Race button now closes whatever is open (Profile, Upgrades, Parts, Catalog, Settings, the Strip or Patch notes) and opens the race menu on its own."],fixed:["Opening the race menu while another panel (e.g. Parts) was open showed both at once, with the race menu behind."]},{version:"0.1.1",date:"2026-10-19",title:"Patch notes + web build",added:["Patch notes: the paper button at the bottom-left of the garage lists every version's additions, changes, fixes and removals.","The button shows NEW until you have read the latest notes.","Web build: the game now builds an index.html next to VoxelCity.html, so the GitHub Pages link opens the game directly."],fixed:["GitHub Pages link opened an empty page (the site had no index.html)."]},{version:"0.1.0",date:"2026-10-19",title:"First playable builds (Oct 16 \u2013 19)",added:["Drag racing: hold to rev, launch on green, timed up-shifts with Perfect / Good / Early / Late grades, downshift paddle with over-rev.","Race HUD: tachometer, gear, speed, Perfect Shift paddle and gas pedal (on-screen or SPACE / SHIFT).","Downtown street scene at real scale: buildings, props, trees, side streets, day / dusk / night, speed blur, start-line camera glide.","Garage: car on a turntable, wallet, and Profile \xB7 Upgrades \xB7 Parts \xB7 Catalog \xB7 Settings.","Panda Civix starter car plus 13 more cars across Leagues D (hatchbacks), C (muscle), B (street racers), A (tuners / GTs) and S (hypercars).","Each car has its own acceleration, shift speed, grip, top speed, l n, change lanes, or stop if there is a need.","The kid next door has a toy car that he drives around the yard. One day, he says, he will race a real one in town.","At the end of the race they all shook hands. No one was mad. They had fun, and they would race again next week.","There is a small cafe by the track. It sells hot tea, warm buns and soup, and it is always full on a race day.","The old truck is slow up hills, but it never breaks down. It has done more miles than any car on our whole street.","Green means go. Red means stop. Keep your hands on the wheel, your eyes on the road, and you will be fine out there."],kg=["The city wakes up slowly. Street lights fade, the first buses pull out of the depot, and somewhere a mechanic is already tuning an engine that will race tonight.","Rain left the road dark and shiny. The tyres hissed as the cars rolled to the line, and every driver waited for the lights with one eye on the big clock.","A good launch is half the race. Hold the revs steady, wait for green, and let the clutch bite smoothly so the wheels grip instead of spinning in place.","The corner shop opens at six. The owner sweeps the step, sets out fresh bread and newspapers, and waves at the tired night drivers heading home to sleep.","Under the bridge the old garage hums with work. Sparks fly from a grinder, a radio plays quietly, and a red hatchback sits on stands waiting for new wheels.","She checked the tyre pressure twice, wiped the windscreen, and took a slow breath. The track ahead was straight and short, and she knew every crack in it.","Downtown traffic moves like a river. Taxis weave between lanes, cyclists slip past the queues, and the delivery vans stop wherever they can find a gap.","The best drivers are calm drivers. They listen to the engine, feel the road through the wheel, and never rush a shift just because the crowd is getting loud.","At night the city glows in blue and orange. Neon signs flicker over the noodle bars, and the quiet streets turn into stages for anyone who is brave enough.","My first car was slow and loud and always smelled of oil. I loved it anyway, and I learned more fixing it in the driveway than I ever learned in a class.","The harbour road runs along the water for two miles. On clear mornings you can see the ferries crossing and hear the gulls fighting over the fish boats.","Every engine has a sweet spot. Shift too early and it bogs down, shift too late and it screams. Find the moment in between and the car pulls like a train.","The market fills the square on Saturdays. There are stalls for fruit, old records, spare parts and hot coffee, and people come from across the river to shop.","He kept a notebook in the glovebox with every race he had ever run. Times, weather, tyre pressures, even what he ate for lunch. Nothing was left to chance.","The tunnel under the hill is the fastest way east. It is long and bright and echoes with every gear change, so drivers there sound twice as fast as they are.","Paint is the last thing to go on. After weeks of welding, sanding and fitting, the car finally rolls into the booth bare and comes out shining like a sweet.","The old stadium is gone now, but the car park is still there. On summer nights it fills with cars, music and friends trading stories about their builds.","Typing fast is a lot like driving fast. Stay relaxed, look a little ahead, and keep a steady rhythm. When you make a mistake, fix it quickly and keep moving.","The bakery on the corner makes the city smell sweet at dawn. Drivers stop for warm rolls on the way to work and leave crumbs all over their front seats.","A storm rolled in from the coast just before the final. The organisers checked the sky, checked the track, and decided the race would go ahead anyway.","The garage cat sleeps on the warm bonnet of whichever car came in last. Nobody minds. She has been there longer than most of the mechanics, after all.","Bridges tie the city together. There are seven of them, from the iron rail bridge in the north to the wide new road bridge that glows bright green at night.","The rookie lost his first ten races. He did not quit. He watched the winners, asked questions, practised his launch every single day, and won the eleventh.","A clean car is a happy car. Wash the dust off the wheels, polish the lights, and vacuum the mats. It will not make you faster, but you will feel faster.","The bus driver knows every pothole on route nine. She steers around them without thinking, chats with the regulars, and still arrives right on time every day.","Light changes everything. The same street looks grey and tired at noon, gold and warm at sunset, and silver and strange under the orange lamps at midnight.","The crowd went quiet as the two cars lined up. One was old and loud, the other new and silent. When the light turned green, both shot off like arrows.","Spare parts pile up in every garage. Old wheels, a broken mirror, a box of bolts that fit nothing. Someday they might be useful, so nobody throws them out.","The park in the middle of the city is an island of green. Joggers loop the lake, kids feed the ducks, and the traffic noise fades to a soft and gentle hum.","Good tyres are worth more than a big engine. If the rubber cannot hold the road, all that power just turns into smoke and noise and a very slow start.","The radio announced the results at nine. The whole street cheered when they heard the name of the kid from the corner garage. He had finally done it, at last.","Some roads are made for speed and some are made for looking. The coast road is both, with long straights and a wide view of the sea around every single bend.","Before every race she taps the dashboard twice for luck. It is a silly habit and she knows it, but she has not lost a race since she started doing it.","The fuel station on the edge of town never closes. Truckers, taxi drivers and night racers all stop there for fuel, snacks and a few quiet minutes of rest.","Building a car takes patience. Parts arrive late, bolts snap, and nothing fits the first time. But the day it starts and drives, it all feels worth it.","The city has a sound of its own. Engines, sirens, footsteps, music from open windows, and under it all the low rumble of trains deep beneath the streets.","A drag race is over in seconds, but the work behind it takes months. Every part is chosen, tested and tuned so the car is ready for those few seconds.","Snow is rare here, but when it falls the city stops. The roads go white and quiet, schools close early, and everyone walks in the middle of the street.","The mechanic wiped her hands and smiled. The engine was running sweet and smooth at last. She closed the bonnet, tossed the keys over, and said good luck.","Win or lose, the drivers meet at the diner after the races. They share chips and stories, argue about gear ratios, and plan next week before going home.","The night before a big race the garage never sleeps. Someone is always bolting on a part, someone is always testing the lights, and someone is always making far too much coffee for everyone who is still awake.","The old tram line still runs along the river, slow and steady, past the warehouses and the new glass towers. Racers wait for it at the crossing, engines ticking over, and wave at the driver as the bell rings and it rolls by.","Tuning is a quiet art. Change one thing, test it, and write down what happened. A little more fuel, a little less weight, a slightly different gear. After a hundred small changes the car feels like a completely different machine.","Every district of the city has its own style. The harbour crews love loud old muscle cars, the uptown drivers polish their hatchbacks until they shine, and the kids from the tunnels build wild machines out of whatever they can find."],Lg=[`At 6:45 on Saturday morning, Marisol rolled her 1998 hatchback onto the scales: 1,042 kg, exactly. "Two kilos lighter than last week," she grinned, "and that's without the spare wheel!"`,`Race control's notice read: "Heats start at 19:30; finals at 21:15. Drivers must sign in by 18:45, wear an approved helmet, and keep their speed under 20 km/h in the pits."`,`Kenji's notebook was full of numbers: 3.21 final drive, 4,800 rpm launch, 29 psi in the fronts, 31 in the rears. Every page ended the same way - "Try again tomorrow, and write it all down."`,"The Harbour Bridge opened in 1931, closed for repairs in 1987, and reopened two years later with six lanes instead of four. Locals still argue about which version looked better.","Why do some drivers shift early? Nerves, mostly. The best advice I ever heard was simple: breathe out, count to two, and trust the lights; the car will do the rest for you.","Priya's shop, Voxel & Sons Tyres, has been on Quay Street since 1974. Her grandfather opened it with a single jack, three spanners and a loan of 400 pounds from his brother.","Weather update: light rain until 14:00, then clearing; winds from the north-west at 15-25 km/h. Track temperature should reach 28 degrees by the evening heats, perfect for grip.","The final was close - absurdly close. Dax crossed the line at 12.418 seconds; Halden at 12.421. Three thousandths! Neither of them believed it until they saw the replay twice.",`"Don't chase the redline," the old mechanic said, tapping the dial. "Find the torque, shift on the beat, and let the engine breathe." Then he went back to his coffee and crossword.`,"Route 9 runs 14 km from the depot to the airport, with 27 stops, 11 traffic lights and one level crossing that, according to every driver, is always closed when you're running late.","The rules are strict: no nitrous on the street, no racing after midnight, and absolutely no burnouts outside the bakery on Elm Road. Mrs. Okafor has complained 17 times this year.","Tuning tip #42: change one thing at a time. If you alter the gearing, tyre pressure and ride height in one go, you'll never know which change helped - or which one cost you 0.3 s.","On the ni
